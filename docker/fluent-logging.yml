# docker/fluent-log/docker-fluent.yml

x-logging: &_logging
    logging:
        driver: fluentd
        options:
            fluentd-address: "${EXT_FLUENT_PORT}"
            fluentd-async: "true"
            fluentd-async-reconnect-interval: "1000ms"
            fluentd-buffer-limit: 8388608
            fluentd-write-timeout: "100s"
            tag: "service.{{.Name}}"
            labels: "com.docker.compose.service,com.docker.compose.project,com.docker.compose.image,tier,log_format"


services:
    php:
        <<: *_logging
        labels:
            tier: "web"
            log_format: "php"
    cron:
        <<: *_logging
        labels:
            tier: "cron"
            log_format: "php"
    mariadb:
        <<: *_logging
        labels:
            tier: "db"
            log_format: "mariadb"
    keydb:
        <<: *_logging
        labels:
            tier: "cache"
            log_format: "redis"
    nginx:
        <<: *_logging
        labels:
            tier: "proxy"
            log_format: "nginx"
        depends_on:
            php:
                condition: service_started
    # --- converter + python workers ---------------------------------------
    # No dedicated fluent-bit parser for these → log_format: "auto" (gl.auto:
    # global json_default unwraps structured JSON, php multiline joins the rest).
    # Switch to a "python"/"worker" parser here once one is added to the submodule.
    worker-libreoffice:
        <<: *_logging
        labels:
            tier: "worker"
            log_format: "auto"
    worker-ffmpeg-audio:
        <<: *_logging
        labels:
            tier: "worker"
            log_format: "auto"
    worker-ffmpeg-video:
        <<: *_logging
        labels:
            tier: "worker"
            log_format: "auto"
    worker-image:
        <<: *_logging
        labels:
            tier: "worker"
            log_format: "auto"
    worker-data:
        <<: *_logging
        labels:
            tier: "worker"
            log_format: "auto"
    ws-gateway:
        <<: *_logging
        labels:
            tier: "worker"
            log_format: "auto"
    worker-ai:
        <<: *_logging
        labels:
            tier: "worker"
            log_format: "auto"
