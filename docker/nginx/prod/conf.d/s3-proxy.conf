# s3.profmatrix.ru — публичный фасад поверх MinIO `apis3.xakki.ru` (path-style S3).
# Архитектура: PHP-клиент (AWS SDK) пишет/удаляет напрямую на apis3.xakki.ru,
# nginx раздаёт публичные GET'ы с кешированием.
#
# DNS для s3.profmatrix.ru → этот prod-nginx-хост настраивается отдельно (вне scope).
# TLS терминируется снаружи (как и для остальных server-блоков проекта):
# в контейнере слушаем только :80; внешний прокси/туннель отдаёт https клиенту.
server {
    listen 80;
    server_name s3.profmatrix.ru s3.profmatrix.variantgood.com;

    # На случай очень больших объектов (через прокси идут только GET/HEAD,
    # но не ограничиваем заранее — приоритет на отсутствие 413).
    client_max_body_size 32M;

    # DNS для апстрима apis3.xakki.ru — внешний, не Docker.
    # http_params использует Docker-резолвер 127.0.0.11 не везде; здесь явный публичный.
    resolver 8.8.8.8 valid=300s ipv6=off;

    # MinIO health probe — должен отвечать 200 без аутентификации.
    # Smoke-тест: curl -I http://s3.profmatrix.ru/minio/health/live
    # Кеш на эту локацию НЕ применяем — нужен живой статус.
    location = /minio/health/live {
        proxy_pass https://apis3.xakki.ru;
        proxy_set_header Host apis3.xakki.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_verify off;  # включить on после проверки CA-доверия к apis3.xakki.ru
        access_log off;
    }

    # Основное проксирование объектов: https://s3.profmatrix.ru/<bucket>/<key>
    # → https://apis3.xakki.ru/<bucket>/<key> (path-style).
    location / {
        # Защита от использования нашего фасада как анонимного PUT-relay'я.
        # Авторизованные PUT/DELETE идут напрямую с PHP-клиента на apis3.xakki.ru,
        # не через nginx-проект.
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass https://apis3.xakki.ru;

        # Host обязательно — иначе MinIO не сматчит маршрут к bucket'у (SNI/Host-routing).
        proxy_set_header Host apis3.xakki.ru;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Range — глобально http_params затирает заголовок (proxy_set_header Range "";),
        # это ломает HTTP Range для больших объектов. Возвращаем для S3-апстрима.
        proxy_set_header Range $http_range;

        # SNI к апстриму.
        proxy_ssl_server_name on;
        proxy_ssl_verify off;  # стартуем с off; включить on после проверки CA-store

        # Кеш — используем pcache zone (params/cache_params, уже подключена через nginx.conf).
        proxy_cache pcache;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        # Длинный публичный кеш для клиентов (объекты неизменяемы по ключу).
        add_header Cache-Control "public, max-age=86400" always;
    }
}
