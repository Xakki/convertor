# pf.xakki.ru → new Preact SPA (app-front, vite dev server on node:5173).
#
# pf.xakki.ru is forwarded here by the public shared-nginx
# (conf.d/xakki/profmatrix.dev.conf server_name includes .pf.xakki.ru →
# host.docker.internal:10060, plain http on :80, TLS already terminated there).
# This block makes pf.xakki.ru serve the SPA, while the default server
# (server_name _) keeps serving the Laravel app for the other hostnames.
#
# API / auth / Scramble docs / Sanctum stay on Laravel (php-fpm), same origin as
# the SPA so cookie auth works without CORS. Vite HMR ws rides `location /`
# (upgraded below); the shared-nginx `location /` must also upgrade ws +
# preserve Host (see xakki/profmatrix.dev.conf, mirrors unidoski.conf).
map $http_upgrade $pf_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name pf.xakki.ru;
    root /app-back/public;

    location ^~ /api/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    location ^~ /sanctum/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        include params/fpm_params;
        fastcgi_param SCRIPT_FILENAME /app-back/public/index.php;
    }

    # Everything else → the vite dev server (the SPA bundle + HMR ws).
    location / {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pf_connection;
        proxy_read_timeout 604800;
        proxy_send_timeout 604800;
    }
}
