server {
    listen   80;
    listen 443 ssl;
    http2  on;
    server_name _;

    ssl_certificate /etc/nginx/params/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/params/ssl/privkey.pem;
    include params/ssl_params;

    # DNS для апстрима apis3.xakki.ru — внешний, не Docker.
    resolver 8.8.8.8 valid=300s ipv6=off;

    root /app-symfony/public;
    index index.php;

    # Server-level proxy timeout defaults (600s) для всех location; /ws/worker/ ниже
    # переопределяет своим 3600s. Раньше жили в shared proxy_params — вынесены сюда,
    # т.к. дублировались с override в одном контексте location (регрессия 3d660ab).
    proxy_connect_timeout 600;
    proxy_send_timeout    600;
    proxy_read_timeout    600;

    # Route all API paths to Laravel before the static-asset regex in
    # common_locations (it matches *.json and would 404 /api/v1/docs.json).
    location ^~ /api/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        #error_log /dev/stderr debug;
        access_log /dev/stdout json_combined;

        # Edge headroom above the 500 MB paid ceiling; the global default stays
        # small. Per-plan enforcement (50 MB free / 500 MB paid) is done in PHP.
        client_max_body_size 512M;

        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET,HEAD,OPTIONS,POST,PUT';
        add_header 'Access-Control-Allow-Headers' 'Origin,Accept,Authorization,X-Requested-With,Content-Type,Access-Control-Request-Method,Access-Control-Request-Headers';

        include fastcgi_params;
        include params/fpm_params;
        fastcgi_param   SCRIPT_FILENAME     /app-symfony/public/index.php;
        fastcgi_param PHP_VALUE "upload_max_filesize = 512M \n post_max_size = 512M";
    }

    location /_intellij_phpdebug_validator.php {
        include fastcgi_params;
        include params/fpm_params;
        fastcgi_param          SCRIPT_FILENAME         $document_root$fastcgi_script_name;
    }

    # AI-worker dev-server route — RETIRED 2026-07-20: on-server worker-ai теперь
    # запускается в прод-режиме (WS-клиент gateway, без FastAPI dev-UI), поэтому
    # порт 8877 (--devserver) больше не поднят по умолчанию. Раскомментировать
    # только если временно возвращаете `--devserver` в docker-compose.worker-ai.yml
    # для локальной отладки.
    # location = /worker-ai { absolute_redirect off; return 301 /worker-ai/; }
    # location ^~ /worker-ai/ {
    #     resolver 127.0.0.11 valid=30s ipv6=off;
    #     set $worker_ai_upstream worker-ai:8877;
    #     rewrite ^/worker-ai/(.*)$ /$1 break;
    #     proxy_pass http://$worker_ai_upstream;
    #     include params/proxy_params;   # http1.1 + Upgrade/Connection → covers /worker-ai/ws/stream
    # }

    # WS-транспорт воркеров → ws-gateway. Здесь терминируется TLS; апстрим — plain ws.
    # Variable upstream + resolver: рестарт gateway не роняет nginx (деградирует в 502).
    # proxy_read/send_timeout ЗАВЕДОМО > самой долгой конвертации (video ~600 s):
    # переопределяют server-level дефолт 600s на 3600s (легальный cross-context override).
    location ^~ /ws/worker/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ws_gateway_upstream ws-gateway:8091;
        proxy_pass http://$ws_gateway_upstream;
        include params/proxy_params;   # http1.1 + Upgrade/Connection
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    include params/s3_location;
    include params/common_locations;
}
