# E2E test overlay — mirrors proxy-service/docker/docker-compose.e2e.yml.
# Activated only on the `make test-e2e` path via COMPOSE_FILE in .env.test;
# never part of prod compose.
#
# Workers must reach Symfony via the internal docker URL (nginx service), not the
# public one from .env.local. Override API_BASE_URL here so it wins over the
# Make-exported .env.local value regardless of shell-env vs env-file precedence.
services:
  worker-data:
    environment:
      API_BASE_URL: http://nginx
  worker-ffmpeg-audio:
    environment:
      API_BASE_URL: http://nginx
  worker-ffmpeg-video:
    environment:
      API_BASE_URL: http://nginx
  worker-image:
    environment:
      API_BASE_URL: http://nginx
  worker-libreoffice:
    environment:
      API_BASE_URL: http://nginx
