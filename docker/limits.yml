
services:
    metrics-exporter:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "0.1"
                    memory: "64M"

    php:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "1"
                    # Symfony/PHPStan одновременно загружают Doctrine metadata и
                    # весь application graph; 512M приводит к OOM-kill даже при
                    # последовательном анализе. 1G сохраняет лимит процесса и
                    # позволяет выполнить обязательный quality gate.
                    memory: "1G"

    cron:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "2"
                    memory: "1G"

    mariadb:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "2"
                    memory: "3G"

    nginx:
        # Prometheus 7d peak (matrix_dev): mem 19M, cpu 0.004
        mem_limit: "128M"
        cpus: "1.0"

    ws-gateway:
        # Async-Python gateway: держит WS-соединения воркеров + читает keydb-стримы.
        # I/O-bound, без тяжёлых вычислений — скромный запас на рост числа соединений.
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "1"
                    memory: "256M"

    keydb:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "0.5"
                    memory: "128M"

    # media-воркеры: cpu намеренно щедрый — 7d-пик снят в idle-окно (реальная
    # конвертация ffmpeg/libreoffice/imagemagick cpu+mem-спайкова); mem не занижать (OOM убьёт задачу).
    # worker-ai — лимиты инлайн в самом сервисе (docker-compose.yml), не здесь.
    worker-data:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "0.5"
                    memory: "256M"

    # Network-bound adapter: reserve a small baseline and leave enough headroom
    # for concurrent HTTP buffers plus catalog/schema parsing.
    worker-api:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "0.5"
                    memory: "256M"
                reservations:
                    cpus: "0.05"
                    memory: "64M"

    worker-ffmpeg-audio:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "2"
                    memory: "256M"

    worker-ffmpeg-video:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "4"
                    memory: "512M"

    worker-image:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "2"
                    memory: "256M"

    worker-libreoffice:
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "2"
                    memory: "768M"
