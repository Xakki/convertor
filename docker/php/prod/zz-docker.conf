
[global]
daemonize = no

;; see: https://github.com/docker-library/php/issues/241
[www]
listen = /run/sock/php-fpm.sock
listen.mode = 0666
access.log = /dev/null

pm = dynamic
pm.max_requests = 1000
pm.max_children = 100
pm.min_spare_servers = 5
pm.start_servers = 7
pm.max_spare_servers = 20
pm.process_idle_timeout = 60s
