[supervisord]
logfile=/proc/1/fd/1
logfile_maxbytes = 0
loglevel = warn
user=root

[supervisorctl]
username = dummy
password = dummy

; Long-running PHP consumer of the conv.result stream (workers → MariaDB).
; Runs in the cron container (ENABLED_SUPERVISORD=1); reuses the bind-mounted
; app code + vendor installed by the php service. --time-limit recycles the
; process (and its Redis connection) hourly; supervisord restarts it.
[program:result-consumer]
command=php bin/console app:queue:result-consumer --time-limit=3600
directory=/app-symfony
user=www-data
autostart=true
autorestart=true
startretries=9999
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/proc/self/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/self/fd/2
stderr_logfile_maxbytes=0

