# Общие env для php / cron (и будущих воркеров на том же image).
# ENABLED_SUPERVISORD=0 пропускает запуск supervisord в entrypoint.sh.
# ENABLED_PHP_FPM=0 пропускает php-fpm (для cron-контейнера).
x-app-env: &_app_env
    APP_ENV: ${APP_ENV}
    TZ: ${TZ}
    # Remap www-data to the host user so composer deploy can write the
    # bind-mounted /app-symfony (vendor/, var/, config/jwt/). Host-specific.
    PUID: ${PUID:-0}
    PGID: ${PGID:-0}
    SYMFONY_ENV: ${SYMFONY_ENV:-dev}
    DB_HOST: ${DB_HOST}
    DB_USERNAME: ${DB_USERNAME}
    DB_DATABASE: ${DB_DATABASE}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: ${REDIS_HOST:-keydb}
    REDIS_USERNAME: ${REDIS_USERNAME:-default}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Canonical Messenger DSN — authoritative here (app-symfony/.env is gitignored).
    # db via ?dbindex (path = stream/group, not db). No password: KeyDB runs
    # protected-mode no / no requirepass. See docs/queue-contract.md §1.
    REDIS_DSN: redis://${REDIS_HOST:-keydb}:6379?dbindex=${REDIS_QUEUE_DB:-2}
    REDIS_CACHE_DB: ${REDIS_CACHE_DB:-0}
    REDIS_SESSION_DB: ${REDIS_SESSION_DB:-1}
    REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
    # JWT keys are file paths defined in app-symfony/.env (config/jwt/*.pem).
    # Do NOT pass JWT_SECRET_KEY/JWT_PUBLIC_KEY here: an empty compose value would
    # override the correct PEM paths (Symfony Dotenv won't override a set env var).
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    CRYPTOMUS_MERCHANT_ID: ${CRYPTOMUS_MERCHANT_ID}
    CRYPTOMUS_API_KEY: ${CRYPTOMUS_API_KEY}
    # S3 result sink + download proxy (shared apis3 MinIO; secrets via .env.local).
    S3_ENDPOINT: ${S3_ENDPOINT}
    S3_KEY: ${S3_KEY}
    S3_SECRET: ${S3_SECRET}
    S3_REGION: ${S3_REGION}
    S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX}
    S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE}

# Общие настройки контейнера для php / cron (одинаковый image, stop-сигналы, security).
x-app-base: &_app_base
    image: ${DOCKER_IMAGE_PHP}
    restart: unless-stopped
    stop_grace_period: 15s
    stop_signal: SIGTERM
    working_dir: /app-symfony
    security_opt:
        - no-new-privileges:true
    networks:
        - default
    extra_hosts:
        - "host.docker.internal:host-gateway"
    tmpfs:
        - /run
        - /tmp
    depends_on:
        mariadb:
            condition: service_healthy
        keydb:
            condition: service_healthy

services:
    php:
        <<: *_app_base
        container_name: "${COMPOSE_PROJECT_NAME}-php"
        hostname: ${COMPOSE_PROJECT_NAME}-php
        # Override anchor's [default]: php also joins backend to reach the
        # libreoffice HTTP worker (WORKER_LIBREOFFICE_URL) + keydb/workers there.
        networks:
            - default
            - backend

        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-fpm.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/${DOCKER_ENV}/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
            - ./docker/php/supervisor.app.ini:/etc/supervisor.d/supervisor.app.ini:ro
            - php-socket:/run/sock
        command: "composer deploy"
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "0"
            ENABLED_PHP_FPM: "1"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-php
        # Override image healthcheck (`pgrep -x "php-fpm"`): Alpine BusyBox pgrep -x
        # сверяет с полным cmdline ("php-fpm: master process (...)"), а не comm,
        # поэтому встроенный healthcheck даёт unhealthy → cron не стартует.
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f '^php-fpm: master' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
            start_interval: 5s

    cron:
        <<: *_app_base
        container_name: "${COMPOSE_PROJECT_NAME}-cron"
        hostname: ${COMPOSE_PROJECT_NAME}-cron
        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-cron.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/supervisor.app.ini:/etc/supervisor.d/supervisor.app.ini:ro
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "1"
            ENABLED_PHP_FPM: "0"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-cron
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'supervisord' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 60s
            start_interval: 10s

    mariadb:
        image: ${DOCKER_IMAGE_MARIADB}
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        working_dir: /backup
        volumes:
            - mariadb-data:/var/lib/mysql
            - ./backup:/backup
            - ./docker/logs:/var/log
            - ./docker/mariadb/scripts:/scripts
            - ./docker/mariadb/${DOCKER_ENV}/mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
            - ./docker/mariadb/${DOCKER_ENV}/init:/docker-entrypoint-initdb.d:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_PASSWORD_WALL: ${MARIADB_PASSWORD_WALL}
            EXPORTER_USER: ${EXPORTER_USER}
            EXPORTER_PASS: ${EXPORTER_PASS}
            MARIADB_AUTO_UPGRADE: 1
        ports:
            - "${EXT_MYSQL_PORT:-127.0.0.1:9122}:3306"
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 15s
            timeout: 3s
            retries: 20
            start_period: 10s
            start_interval: 5s
        networks:
            - default
        # Prometheus 7d peak (matrix_dev): mem 668M, cpu 0.02 (запас на рост buffer pool)
        mem_limit: "3G"
        cpus: "2"

    keydb:
        image: ${DOCKER_IMAGE_KEYDB}
        container_name: "${COMPOSE_PROJECT_NAME}-keydb"
        restart: unless-stopped
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-keydb
        volumes:
            - keydb-data:/data
            - ./docker/redis/keydb.conf:/etc/keydb/keydb.conf:ro
        ports:
            - "${EXT_REDIS_PORT}:6379"
        healthcheck:
            test: [ "CMD", "keydb-cli", "-h", "localhost", "-p", "6379", "ping" ]
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 4s
        # On both: queue producer (php/cron) reach it via default; the 5 workers
        # live on the internal backend net and reach it there.
        networks:
            - default
            - backend

    nginx:
        image: ${DOCKER_IMAGE_NGINX}
        restart: unless-stopped
        stop_grace_period: 5s
        stop_signal: SIGTERM
        working_dir: /public
        volumes:
            - php-socket:/run/sock
            - ./app-symfony/public:/app-symfony/public:ro
            - ./docker/nginx/params:/etc/nginx/params:ro
            - ./docker/nginx/${DOCKER_ENV}/conf.d:/etc/nginx/conf.d:ro
            - ./docker/nginx/${DOCKER_ENV}/nginx.conf:/etc/nginx/nginx.conf:ro
            - /dev/null:/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-nginx
        ports:
            - "${EXT_NGINX_PORT:-80}:80"
            - "${EXT_NGINX_PORTS:-443}:443"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://127.0.0.1/ping" ]
            interval: 15s
            timeout: 1s
            retries: 5
            start_period: 4s
        networks:
            - default
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            php:
                condition: service_started

    worker-libreoffice:
        build:
            context: .
            dockerfile: docker/workers/libreoffice.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-libreoffice:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-libreoffice"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            # Workers read REDIS_DB; keep it on db 2 to match the PHP messenger
            # transport (REDIS_DSN ?dbindex=2). See docs/queue-contract.md.
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python3", "-c", "import redis; r=redis.Redis(host='keydb', password='${REDIS_PASSWORD}', db=2); r.ping()"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s
        networks:
            - backend

    worker-ffmpeg:
        build:
            context: .
            dockerfile: docker/workers/ffmpeg.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-ffmpeg:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ffmpeg"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            # Workers read REDIS_DB; keep it on db 2 to match the PHP messenger
            # transport (REDIS_DSN ?dbindex=2). See docs/queue-contract.md.
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
            WORKER_MODULE: workers.ffmpeg.worker
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "ffmpeg", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - backend

    worker-image:
        build:
            context: .
            dockerfile: docker/workers/image.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-image:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-image"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            # Workers read REDIS_DB; keep it on db 2 to match the PHP messenger
            # transport (REDIS_DSN ?dbindex=2). See docs/queue-contract.md.
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
            WORKER_MODULE: workers.image.worker
            REDIS_PORT: ${REDIS_PORT:-6379}
            # Image worker uploads results to S3 + emits the result event.
            S3_ENDPOINT: ${S3_ENDPOINT}
            S3_KEY: ${S3_KEY}
            S3_SECRET: ${S3_SECRET}
            S3_REGION: ${S3_REGION}
            S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX}
            S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE}
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "convert", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # default = egress to the shared S3 endpoint (apis3.xakki.ru); backend =
        # reach keydb. Other workers get `default` too when migrated (Phase 4).
        networks:
            - default
            - backend

    worker-ai:
        profiles: ["ai"]
        build:
            context: .
            dockerfile: docker/workers/ai.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-ai:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ai"
        restart: unless-stopped
        stop_grace_period: 60s
        stop_signal: SIGTERM
        volumes:
            - whisper-models:/home/app/.cache/huggingface
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            # Workers read REDIS_DB; keep it on db 2 to match the PHP messenger
            # transport (REDIS_DSN ?dbindex=2). See docs/queue-contract.md.
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
            WORKER_MODULE: workers.ai.worker
            WHISPER_MODEL: ${WHISPER_MODEL:-base}
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python3", "-c", "import faster_whisper; print('ok')"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 30s
        networks:
            - backend

    worker-data:
        build:
            context: .
            dockerfile: docker/workers/data.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-data:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-data"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            # Workers read REDIS_DB; keep it on db 2 to match the PHP messenger
            # transport (REDIS_DSN ?dbindex=2). See docs/queue-contract.md.
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
            WORKER_MODULE: workers.data.worker
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python3", "-c", "import pandas, yaml, lxml; print('ok')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        networks:
            - backend

networks:
    default:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-network"
    backend:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-backend"
        internal: true

volumes:
    mariadb-data:
        name: "${COMPOSE_PROJECT_NAME}-mariadb-data"
    keydb-data:
        name: "${COMPOSE_PROJECT_NAME}-keydb-data"
    php-socket:
        name: "${COMPOSE_PROJECT_NAME}-php-socket"
    whisper-models:
        name: "${COMPOSE_PROJECT_NAME}-whisper-models"
