# Общие env для php / cron (и будущих воркеров на том же image).
# ENABLED_SUPERVISORD=0 пропускает запуск supervisord в entrypoint.sh.
# ENABLED_PHP_FPM=0 пропускает php-fpm (для cron-контейнера).
x-app-env: &_app_env
    APP_ENV: ${APP_ENV}
    TZ: ${TZ}
    # Remap www-data to the host user so composer deploy can write the
    # bind-mounted /app-symfony (vendor/, var/, config/jwt/). Host-specific.
    PUID: ${PUID:-0}
    PGID: ${PGID:-0}
    DB_HOST: ${DB_HOST}
    DB_USERNAME: ${DB_USERNAME}
    DB_DATABASE: ${DB_DATABASE}
    DB_PASSWORD: ${DB_PASSWORD}
    # JWT keys are file paths defined in app-symfony/.env (config/jwt/*.pem).
    # REDIS_DSN/SESSIONS_DSN, REFRESH_*, TELEGRAM_BOT_TOKEN: Symfony-only — read from
    # app-symfony/.env* by Dotenv; not injected here to avoid process-env override issue.
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    CRYPTOMUS_MERCHANT_ID: ${CRYPTOMUS_MERCHANT_ID}
    CRYPTOMUS_API_KEY: ${CRYPTOMUS_API_KEY}
    # S3 result sink + download proxy (shared apis3 MinIO; secrets via .env.local).
    S3_ENDPOINT: ${S3_ENDPOINT}
    S3_KEY: ${S3_KEY}
    S3_SECRET: ${S3_SECRET}
    S3_REGION: ${S3_REGION}
    S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX}
    S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE}

# Общие настройки контейнера для php / cron (одинаковый image, stop-сигналы, security).
x-app-base: &_app_base
    image: ${DOCKER_IMAGE_PHP}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    stop_signal: SIGTERM
    working_dir: /app-symfony
    security_opt:
        - no-new-privileges:true
    networks:
        - default
    extra_hosts:
        - "host.docker.internal:host-gateway"
    tmpfs:
        - /run
        - /tmp
    depends_on:
        mariadb:
            condition: service_healthy
        keydb:
            condition: service_healthy

services:
    php:
        <<: *_app_base
        container_name: "${COMPOSE_PROJECT_NAME}-php"
        hostname: ${COMPOSE_PROJECT_NAME}-php
        # Override anchor's [default]: php also joins backend to reach
        # keydb + the stream workers there.
        networks:
            - default
            - backend
        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-fpm.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/${DOCKER_ENV}/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
            - ./docker/php/supervisor.app.ini:/etc/supervisor.d/supervisor.app.ini:ro
            - php-socket:/run/sock
        command: "composer deploy"
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "0"
            ENABLED_PHP_FPM: "1"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-php
        # Override image healthcheck (`pgrep -x "php-fpm"`): Alpine BusyBox pgrep -x
        # сверяет с полным cmdline ("php-fpm: master process (...)"), а не comm,
        # поэтому встроенный healthcheck даёт unhealthy → cron не стартует.
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f '^php-fpm: master' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
            start_interval: 5s

    cron:
        <<: *_app_base
        container_name: "${COMPOSE_PROJECT_NAME}-cron"
        hostname: ${COMPOSE_PROJECT_NAME}-cron
        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-cron.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/supervisor.app.ini:/etc/supervisor.d/supervisor.app.ini:ro
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "1"
            ENABLED_PHP_FPM: "0"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-cron
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'supervisord' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 60s
            start_interval: 10s

    mariadb:
        image: ${DOCKER_IMAGE_MARIADB}
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        working_dir: /backup
        volumes:
            - mariadb-data:/var/lib/mysql
            - ./backup:/backup
            - ./docker/logs:/var/log
            - ./docker/mariadb/scripts:/scripts
            - ./docker/mariadb/${DOCKER_ENV}/mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
            - ./docker/mariadb/${DOCKER_ENV}/init:/docker-entrypoint-initdb.d:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_PASSWORD_WALL: ${MARIADB_PASSWORD_WALL}
            EXPORTER_USER: ${EXPORTER_USER}
            EXPORTER_PASS: ${EXPORTER_PASS}
            MARIADB_AUTO_UPGRADE: 1
        ports:
            - "${EXT_MYSQL_PORT:-127.0.0.1:9122}:3306"
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 15s
            timeout: 3s
            retries: 20
            start_period: 10s
            start_interval: 5s
        networks:
            - default
        # Prometheus 7d peak (matrix_dev): mem 668M, cpu 0.02 (запас на рост buffer pool)
        mem_limit: "3G"
        cpus: "2"

    keydb:
        image: ${DOCKER_IMAGE_KEYDB}
        container_name: "${COMPOSE_PROJECT_NAME}-keydb"
        restart: unless-stopped
        init: true
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-keydb
        volumes:
            - keydb-data:/data
            - ./docker/redis/keydb.conf:/etc/keydb/keydb.conf:ro
        ports:
            - "${EXT_REDIS_PORT}:6379"
        healthcheck:
            test: [ "CMD", "keydb-cli", "-h", "localhost", "-p", "6379", "ping" ]
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 4s
        # default: queue producers (php/cron); backend: metrics-exporter scrape.
        networks:
            - default
            - backend

    nginx:
        image: ${DOCKER_IMAGE_NGINX}
        restart: unless-stopped
        init: true
        stop_grace_period: 5s
        stop_signal: SIGTERM
        working_dir: /public
        volumes:
            - php-socket:/run/sock
            - ./app-symfony/public:/app-symfony/public:ro
            - ./docker/nginx/params:/etc/nginx/params:ro
            - ./docker/nginx/${DOCKER_ENV}/conf.d:/etc/nginx/conf.d:ro
            - ./docker/nginx/${DOCKER_ENV}/nginx.conf:/etc/nginx/nginx.conf:ro
            - /dev/null:/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-nginx
        ports:
            - "${EXT_NGINX_PORT:-80}:80"
            - "${EXT_NGINX_PORTS:-443}:443"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://127.0.0.1/ping" ]
            interval: 15s
            timeout: 1s
            retries: 5
            start_period: 4s
        networks:
            - default
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            php:
                condition: service_started

    worker-libreoffice:
        build:
            context: .
            dockerfile: docker/workers/libreoffice.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-libreoffice:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-libreoffice"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.libreoffice.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-libreoffice
            WORKER_TYPE: document
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "soffice", "--version"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-ffmpeg-audio:
        build:
            context: .
            dockerfile: docker/workers/ffmpeg.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-ffmpeg:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ffmpeg-audio"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.ffmpeg.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-ffmpeg-audio
            WORKER_TYPE: audio
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "ffmpeg", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-ffmpeg-video:
        build:
            context: .
            dockerfile: docker/workers/ffmpeg.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-ffmpeg:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ffmpeg-video"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.ffmpeg.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-ffmpeg-video
            WORKER_TYPE: video
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "ffmpeg", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-image:
        build:
            context: .
            dockerfile: docker/workers/image.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-image:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-image"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.image.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-image
            WORKER_TYPE: image
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "convert", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    # worker-ai is a REMOTE worker (home WSL + GPU), run separately via
    # docker-compose.worker-ai.yml (add it to COMPOSE_FILE in .env.local). It is
    # intentionally NOT part of the main on-server stack.

    worker-data:
        build:
            context: .
            dockerfile: docker/workers/data.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-data:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-data"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.data.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-data
            WORKER_TYPE: data
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "python3", "-c", "import pandas, yaml, lxml; print('ok')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    ws-gateway:
        build:
            context: .
            dockerfile: docker/workers/gateway.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/ws-gateway:latest
        container_name: "${COMPOSE_PROJECT_NAME}-ws-gateway"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_DB: ${REDIS_DB:-2}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            WS_BLOCK_MS: ${WS_BLOCK_MS}
            WS_HOST: ${WS_HOST}
            WS_PORT: ${WS_PORT}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            WS_RESULT_INLINE_MAX: ${WS_RESULT_INLINE_MAX}
            GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
            SYMFONY_INTERNAL_URL: ${SYMFONY_INTERNAL_URL}
            WS_PING_INTERVAL_S: ${WS_PING_INTERVAL_S}
            WS_LIVENESS_MISSED_PINGS: ${WS_LIVENESS_MISSED_PINGS}
            WS_RECONNECT_BACKOFF_BASE_S: ${WS_RECONNECT_BACKOFF_BASE_S}
            WS_RECONNECT_BACKOFF_MAX_S: ${WS_RECONNECT_BACKOFF_MAX_S}
            WS_RECONNECT_BACKOFF_FACTOR: ${WS_RECONNECT_BACKOFF_FACTOR}
            RECLAIM_INTERVAL_S: ${RECLAIM_INTERVAL_S:-60}
            RECLAIM_BATCH: ${RECLAIM_BATCH:-10}
            RECLAIM_IDLE_MS_DOCUMENT: ${RECLAIM_IDLE_MS_DOCUMENT:-300000}
            RECLAIM_IDLE_MS_IMAGE: ${RECLAIM_IDLE_MS_IMAGE:-120000}
            RECLAIM_IDLE_MS_AUDIO: ${RECLAIM_IDLE_MS_AUDIO:-300000}
            RECLAIM_IDLE_MS_VIDEO: ${RECLAIM_IDLE_MS_VIDEO:-600000}
            RECLAIM_IDLE_MS_DATA: ${RECLAIM_IDLE_MS_DATA:-180000}
            RECLAIM_IDLE_MS_AI: ${RECLAIM_IDLE_MS_AI:-300000}
        depends_on:
            keydb:
                condition: service_healthy
        # backend: единственный читатель keydb (XREADGROUP/XACK/XAUTOCLAIM);
        # default: публичный фронт (nginx /ws/worker/) + egress к Symfony (internal relay).
        networks:
            - backend
            - default

    metrics-exporter:
        build:
            context: .
            dockerfile: docker/workers/metrics_exporter.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/metrics-exporter:latest
        container_name: "convertor-metrics-exporter"
        restart: unless-stopped
        init: true
        stop_grace_period: 10s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            CONSUMER_GROUP: ${CONSUMER_GROUP:-convertor}
            METRICS_POLL_INTERVAL: ${METRICS_POLL_INTERVAL:-15}
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:9472/metrics"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # backend — reaches keydb; common — scraped by dockprom Prometheus.
        # No host port: internal scrape only via convertor-metrics-exporter:9472.
        networks:
            - backend
            - common

networks:
    default:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-network"
    backend:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-backend"
        internal: true
    common:
        external: true
        name: common

volumes:
    mariadb-data:
        name: "${COMPOSE_PROJECT_NAME}-mariadb-data"
    keydb-data:
        name: "${COMPOSE_PROJECT_NAME}-keydb-data"
    php-socket:
        name: "${COMPOSE_PROJECT_NAME}-php-socket"
