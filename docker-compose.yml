# Общие env для php / cron (и будущих воркеров на том же image).
# ENABLED_SUPERVISORD=0 пропускает запуск supervisord в entrypoint.sh.
# ENABLED_PHP_FPM=0 пропускает php-fpm (для cron-контейнера).
x-app-env: &_app_env
    APP_ENV: ${APP_ENV}
    TZ: ${TZ}
    SYMFONY_ENV: ${SYMFONY_ENV:-dev}
    DB_HOST: ${DB_HOST}
    DB_USERNAME: ${DB_USERNAME}
    DB_DATABASE: ${DB_DATABASE}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: ${REDIS_HOST:-keydb}
    REDIS_USERNAME: ${REDIS_USERNAME:-default}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_CACHE_DB: ${REDIS_CACHE_DB:-0}
    REDIS_SESSION_DB: ${REDIS_SESSION_DB:-1}
    REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    CRYPTOMUS_MERCHANT_ID: ${CRYPTOMUS_MERCHANT_ID}
    CRYPTOMUS_API_KEY: ${CRYPTOMUS_API_KEY}
    SHARE_DIR: ${SHARE_DIR:-/shared-files}
    WORKER_LIBREOFFICE_URL: ${WORKER_LIBREOFFICE_URL:-http://worker-libreoffice:6001}
    WORKER_FFMPEG_URL: ${WORKER_FFMPEG_URL:-http://worker-ffmpeg:6001}
    WORKER_IMAGE_URL: ${WORKER_IMAGE_URL:-http://worker-image:6001}
    WORKER_AI_URL: ${WORKER_AI_URL:-http://worker-ai:6001}
    WORKER_DATA_URL: ${WORKER_DATA_URL:-http://worker-data:6001}

# Общие настройки контейнера для php / cron (одинаковый image, stop-сигналы, security).
x-app-base: &_app_base
    image: ${DOCKER_IMAGE_PHP}
    restart: unless-stopped
    stop_grace_period: 15s
    stop_signal: SIGTERM
    working_dir: /app-symfony
    security_opt:
        - no-new-privileges:true
    networks:
        - default
    extra_hosts:
        - "host.docker.internal:host-gateway"
    tmpfs:
        - /run
        - /tmp
    depends_on:
        mariadb:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    php:
        <<: *_app_base
        hostname: ${COMPOSE_PROJECT_NAME}-php

        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-fpm.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/${DOCKER_ENV}/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
            - ./docker/php/supervisor.laravel.ini:/etc/supervisor.d/supervisor.laravel.ini:ro
            - sock:/run/sock
        command: "composer deploy"
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "0"
            ENABLED_PHP_FPM: "1"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-php
        # Override image healthcheck (`pgrep -x "php-fpm"`): Alpine BusyBox pgrep -x
        # сверяет с полным cmdline ("php-fpm: master process (...)"), а не comm,
        # поэтому встроенный healthcheck даёт unhealthy → cron не стартует.
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f '^php-fpm: master' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
            start_interval: 5s

    cron:
        <<: *_app_base
        hostname: ${COMPOSE_PROJECT_NAME}-cron
        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-cron.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/supervisor.laravel.ini:/etc/supervisor.d/supervisor.laravel.ini:ro
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "1"
            ENABLED_PHP_FPM: "0"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-cron
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'supervisord' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 60s
            start_interval: 10s

    mariadb:
        image: ${DOCKER_IMAGE_MARIADB}
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        working_dir: /backup
        volumes:
            - mariadb-data:/var/lib/mysql
            - ./backup:/backup
            - ./docker/logs:/var/log
            - ./docker/mariadb/scripts:/scripts
            - ./docker/mariadb/${DOCKER_ENV}/mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
            - ./docker/mariadb/${DOCKER_ENV}/init:/docker-entrypoint-initdb.d:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            MARIADB_PASSWORD_WALL: ${MARIADB_PASSWORD_WALL}
            EXPORTER_USER: ${EXPORTER_USER}
            EXPORTER_PASS: ${EXPORTER_PASS}
            MARIADB_AUTO_UPGRADE: 1
        ports:
            - "${EXT_MYSQL_PORT:-127.0.0.1:9122}:3306"
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 15s
            timeout: 3s
            retries: 20
            start_period: 10s
            start_interval: 5s
        networks:
            - default
        # Prometheus 7d peak (matrix_dev): mem 668M, cpu 0.02 (запас на рост buffer pool)
        mem_limit: "3G"
        cpus: "2"

    redis:
        image: ${DOCKER_IMAGE_KEYDB}
        restart: unless-stopped
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-redis
        volumes:
            - redis-data:/data
            - ./docker/redis/keydb.conf:/etc/keydb/keydb.conf:ro
        ports:
            - "${EXT_REDIS_PORT}:6379"
        healthcheck:
            test: [ "CMD", "keydb-cli", "-h", "localhost", "-p", "6379", "ping" ]
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 4s
        networks:
            - default

    nginx:
        image: ${DOCKER_IMAGE_NGINX}
        restart: unless-stopped
        stop_grace_period: 5s
        stop_signal: SIGTERM
        working_dir: /public
        volumes:
            - sock:/run/sock
            - ./app-back/public:/app-back/public:ro
            - ./app-back/storage:/app-back/storage:ro
            - ./docker/nginx/params:/etc/nginx/params:ro
            - ./docker/nginx/${DOCKER_ENV}/conf.d:/etc/nginx/conf.d:ro
            - ./docker/nginx/${DOCKER_ENV}/nginx.conf:/etc/nginx/nginx.conf:ro
            - /dev/null:/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-nginx
        ports:
            - "${EXT_NGINX_PORT:-80}:80"
            - "${EXT_NGINX_PORTS:-443}:443"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://127.0.0.1/ping" ]
            interval: 15s
            timeout: 1s
            retries: 5
            start_period: 4s
        networks:
            - default
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            php:
                condition: service_started

    libreoffice:
        image: ${DOCKER_IMAGE_LIBRE}
        container_name: "${COMPOSE_PROJECT_NAME}-libreoffice"
        restart: unless-stopped
        stop_grace_period: 5s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-libreoffice
            PORT: 6000
            SHARE_DIR: /shared-files
        volumes:
            - shared-files:/shared-files
        ports:
            - "${EXT_LIBRE_PORT}:6000"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6000/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s
        networks:
            - backend

    worker-libreoffice:
        build:
            context: .
            dockerfile: docker/workers/libreoffice.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-libreoffice:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-libreoffice"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        volumes:
            - shared-files:/shared-files
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
            SHARE_DIR: ${SHARE_DIR:-/shared-files}
            LIBREOFFICE_URL: http://libreoffice:6000
        depends_on:
            keydb:
                condition: service_healthy
            libreoffice:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python3", "-c", "import redis; r=redis.Redis(host='keydb', password='${REDIS_PASSWORD}', db=2); r.ping()"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s
        networks:
            - backend

    worker-ffmpeg:
        build:
            context: .
            dockerfile: docker/workers/ffmpeg.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-ffmpeg:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ffmpeg"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        volumes:
            - shared-files:/shared-files
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
            SHARE_DIR: ${SHARE_DIR:-/shared-files}
            WORKER_MODULE: workers.ffmpeg.worker
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "ffmpeg", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - backend

    worker-image:
        build:
            context: .
            dockerfile: docker/workers/image.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-image:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-image"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        volumes:
            - shared-files:/shared-files
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
            SHARE_DIR: ${SHARE_DIR:-/shared-files}
            WORKER_MODULE: workers.image.worker
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "convert", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        networks:
            - backend

    worker-ai:
        build:
            context: .
            dockerfile: docker/workers/ai.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-ai:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ai"
        restart: unless-stopped
        stop_grace_period: 60s
        stop_signal: SIGTERM
        volumes:
            - shared-files:/shared-files
            - whisper-models:/root/.cache/huggingface
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
            SHARE_DIR: ${SHARE_DIR:-/shared-files}
            WORKER_MODULE: workers.ai.worker
            WHISPER_MODEL: ${WHISPER_MODEL:-base}
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python3", "-c", "import faster_whisper; print('ok')"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 30s
        networks:
            - backend

    worker-data:
        build:
            context: .
            dockerfile: docker/workers/data.Dockerfile
        image: ${COMPOSE_PROJECT_NAME}/worker-data:latest
        container_name: "${COMPOSE_PROJECT_NAME}-worker-data"
        restart: unless-stopped
        stop_grace_period: 30s
        stop_signal: SIGTERM
        volumes:
            - shared-files:/shared-files
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_QUEUE_DB: ${REDIS_QUEUE_DB:-2}
            SHARE_DIR: ${SHARE_DIR:-/shared-files}
            WORKER_MODULE: workers.data.worker
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python3", "-c", "import pandas, yaml, lxml; print('ok')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        networks:
            - backend

networks:
    default:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-network"
    backend:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-backend"
        internal: true

volumes:
    mariadb-data:
        name: "${COMPOSE_PROJECT_NAME}-mariadb-data"
    keydb-data:
        name: "${COMPOSE_PROJECT_NAME}-keydb-data"
    shared-files:
        name: "${COMPOSE_PROJECT_NAME}-shared-files"
    php-socket:
        name: "${COMPOSE_PROJECT_NAME}-php-socket"
    whisper-models:
        name: "${COMPOSE_PROJECT_NAME}-whisper-models"
