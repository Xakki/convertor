# Общие env для php / cron (и будущих воркеров на том же image).
# ENABLED_SUPERVISORD=0 пропускает запуск supervisord в entrypoint.sh.
# ENABLED_PHP_FPM=0 пропускает php-fpm (для cron-контейнера).
x-app-env: &_app_env
    APP_ENV: ${APP_ENV}
    TZ: ${TZ}
    # Remap www-data to the host user so composer deploy can write the
    # bind-mounted /app-symfony (vendor/, var/, config/jwt/). Host-specific.
    PUID: ${PUID:-0}
    PGID: ${PGID:-0}
    # DATABASE_URL, REDIS_DSN/SESSIONS_DSN, REFRESH_*, TELEGRAM_BOT_TOKEN, JWT-пути,
    # FILE_RETENTION_*: Symfony-only — Dotenv читает их из app-symfony/.env*; сюда НЕ
    # инжектим, иначе process-env перебил бы per-env оверрайды (.env.test и пр.).
    # WORKER_API_TOKEN/GATEWAY_INTERNAL_TOKEN: unlike the vars above, the
    # process-env override here is INTENTIONAL — single source of truth is
    # root .env.local (same as worker/ws-gateway services below), injected
    # here too so it wins over whatever app-symfony/.env* has and Symfony
    # never drifts from workers/gateway again (incident "#6 stuck").
    WORKER_API_TOKEN: ${WORKER_API_TOKEN}
    GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    CRYPTOMUS_MERCHANT_ID: ${CRYPTOMUS_MERCHANT_ID}
    CRYPTOMUS_API_KEY: ${CRYPTOMUS_API_KEY}
    # S3 result sink + download proxy (shared apis3 MinIO; secrets via .env.local).
    S3_ENDPOINT: ${S3_ENDPOINT}
    S3_KEY: ${S3_KEY}
    S3_SECRET: ${S3_SECRET}
    S3_REGION: ${S3_REGION}
    S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX}
    S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE}

# Общие настройки контейнера для php / cron (одинаковый image, stop-сигналы, security).
x-app-base: &_app_base
    image: ${DOCKER_IMAGE_PHP}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    stop_signal: SIGTERM
    working_dir: /app-symfony
    security_opt:
        - no-new-privileges:true
    networks:
        - default
    extra_hosts:
        - "host.docker.internal:host-gateway"
    tmpfs:
        - /run
        - /tmp
    depends_on:
        mariadb:
            condition: service_healthy
        keydb:
            condition: service_healthy

services:
    # Профиль `server` (php/cron/mariadb/keydb/nginx/ws-gateway) — серверная часть.
    # Remote worker-хост его НЕ активирует: там `make up` поднимает только воркеров
    # (они без профиля) + fluent — см. .env.local_worker_example.
    php:
        <<: *_app_base
        profiles: ["server"]
        container_name: "${COMPOSE_PROJECT_NAME}-php"
        hostname: ${COMPOSE_PROJECT_NAME}-php
        # Override anchor's [default]: php also joins backend to reach
        # keydb + the stream workers there.
        networks:
            - default
            - backend
        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-fpm.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/${DOCKER_ENV}/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
            - ./docker/php/supervisor.app.ini:/etc/supervisor.d/supervisor.app.ini:ro
            - php-socket:/run/sock
        command: "composer deploy"
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "0"
            ENABLED_PHP_FPM: "1"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-php
        # Override image healthcheck (`pgrep -x "php-fpm"`): Alpine BusyBox pgrep -x
        # сверяет с полным cmdline ("php-fpm: master process (...)"), а не comm,
        # поэтому встроенный healthcheck даёт unhealthy → cron не стартует.
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f '^php-fpm: master' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s
            start_interval: 5s

    cron:
        <<: *_app_base
        profiles: ["server"]
        container_name: "${COMPOSE_PROJECT_NAME}-cron"
        hostname: ${COMPOSE_PROJECT_NAME}-cron
        volumes:
            - ./app-symfony:/app-symfony
            - ./docker/php/${DOCKER_ENV}/php-cron.ini:/usr/local/etc/php/conf.d/app.ini:ro
            - ./docker/php/supervisor.app.ini:/etc/supervisor.d/supervisor.app.ini:ro
        environment:
            <<: *_app_env
            ENABLED_SUPERVISORD: "1"
            ENABLED_PHP_FPM: "0"
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-cron
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'supervisord' > /dev/null || exit 1"]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 60s
            start_interval: 10s

    mariadb:
        image: ${DOCKER_IMAGE_MARIADB}
        profiles: ["server"]
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        working_dir: /backup
        volumes:
            - mariadb-data:/var/lib/mysql
            - ./backup:/backup
            - ./docker/logs:/var/log
            - ./docker/mariadb/scripts:/scripts
            - ./docker/mariadb/${DOCKER_ENV}/mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
            - ./docker/mariadb/${DOCKER_ENV}/init:/docker-entrypoint-initdb.d:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            MARIADB_DATABASE: ${MARIADB_DATABASE}
            MARIADB_USER: ${MARIADB_USER}
            MARIADB_PASSWORD: ${MARIADB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
            EXPORTER_USER: ${EXPORTER_USER}
            EXPORTER_PASS: ${EXPORTER_PASS}
            MARIADB_AUTO_UPGRADE: 1
        ports:
            - "${EXT_MYSQL_PORT:-127.0.0.1:9122}:3306"
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 15s
            timeout: 3s
            retries: 20
            start_period: 10s
            start_interval: 5s
        networks:
            - default
        # Prometheus 7d peak (matrix_dev): mem 668M, cpu 0.02 (запас на рост buffer pool)
        mem_limit: "3G"
        cpus: "2"

    keydb:
        image: ${DOCKER_IMAGE_KEYDB}
        profiles: ["server"]
        container_name: "${COMPOSE_PROJECT_NAME}-keydb"
        restart: unless-stopped
        init: true
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-keydb
        volumes:
            - keydb-data:/data
            - ./docker/redis/keydb.conf:/etc/keydb/keydb.conf:ro
        ports:
            - "${EXT_REDIS_PORT}:6379"
        healthcheck:
            test: [ "CMD", "keydb-cli", "-h", "localhost", "-p", "6379", "ping" ]
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 4s
        # default: queue producers (php/cron); backend: metrics-exporter scrape.
        networks:
            - default
            - backend

    nginx:
        image: ${DOCKER_IMAGE_NGINX}
        profiles: ["server"]
        restart: unless-stopped
        init: true
        stop_grace_period: 5s
        stop_signal: SIGTERM
        working_dir: /public
        volumes:
            - php-socket:/run/sock
            - ./app-symfony/public:/app-symfony/public:ro
            - ./docker/nginx/params:/etc/nginx/params:ro
            - ./docker/nginx/${DOCKER_ENV}/conf.d:/etc/nginx/conf.d:ro
            - ./docker/nginx/${DOCKER_ENV}/nginx.conf:/etc/nginx/nginx.conf:ro
            - /dev/null:/docker-entrypoint.d/10-listen-on-ipv6-by-default.sh:ro
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-nginx
        ports:
            - "${EXT_NGINX_PORT:-80}:80"
            - "${EXT_NGINX_PORTS:-443}:443"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://127.0.0.1/ping" ]
            interval: 15s
            timeout: 1s
            retries: 5
            start_period: 4s
        networks:
            - default
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            php:
                condition: service_started

    worker-libreoffice:
        build:
            context: .
            dockerfile: docker/workers/libreoffice.Dockerfile
        image: ${IMAGE_NS}/worker-libreoffice:${IMAGE_TAG:-latest}
        pull_policy: ${WORKER_PULL_POLICY:-missing}
        container_name: "${COMPOSE_PROJECT_NAME}-worker-libreoffice"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.libreoffice.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-libreoffice
            WORKER_TYPE: document
            # registry-08: явный host/node-идентификатор для admin-страницы воркеров —
            # HOST_NAME уже вычисляется Makefile'ом (`hostname`, экспортируется в env
            # docker compose) для fluent-bit-лейблов; переиспользуем тот же источник,
            # не заводя отдельную переменную.
            WORKER_HOST: ${HOST_NAME}
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "soffice", "--version"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-ffmpeg-audio:
        build:
            context: .
            dockerfile: docker/workers/ffmpeg.Dockerfile
        image: ${IMAGE_NS}/worker-ffmpeg:${IMAGE_TAG:-latest}
        pull_policy: ${WORKER_PULL_POLICY:-missing}
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ffmpeg-audio"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.ffmpeg.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-ffmpeg-audio
            WORKER_TYPE: audio
            # registry-08: см. комментарий у worker-libreoffice выше.
            WORKER_HOST: ${HOST_NAME}
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "ffmpeg", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-ffmpeg-video:
        build:
            context: .
            dockerfile: docker/workers/ffmpeg.Dockerfile
        image: ${IMAGE_NS}/worker-ffmpeg:${IMAGE_TAG:-latest}
        pull_policy: ${WORKER_PULL_POLICY:-missing}
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ffmpeg-video"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.ffmpeg.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-ffmpeg-video
            WORKER_TYPE: video
            # registry-08: см. комментарий у worker-libreoffice выше.
            WORKER_HOST: ${HOST_NAME}
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "ffmpeg", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-image:
        build:
            context: .
            dockerfile: docker/workers/image.Dockerfile
        image: ${IMAGE_NS}/worker-image:${IMAGE_TAG:-latest}
        pull_policy: ${WORKER_PULL_POLICY:-missing}
        container_name: "${COMPOSE_PROJECT_NAME}-worker-image"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.image.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-image
            WORKER_TYPE: image
            # registry-08: см. комментарий у worker-libreoffice выше.
            WORKER_HOST: ${HOST_NAME}
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "convert", "-version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-ai:
        # CPU-образ по умолчанию (собирается `make build-ai-cpu`); на GPU-хосте
        # переопределить AI_VARIANT=cuda + AI_RUNTIME=nvidia в .env.local (см.
        # .env.local_example, docs/workers-remote-deploy.md).
        # build: нужен, чтобы голый `make up`/`docker compose up` на свежем хосте не пытался
        # ПУЛЛИТЬ несуществующий тег (worker-ai в Harbor не публикуется — только
        # worker-ai-base), а сам собрал рабочий образ. Двухступенчатая схема
        # (ai-base → ai.cpu/ai.cuda) — см. workers/Makefile: `make build-ai-cpu`/
        # `build-ai-cuda` остаются рекомендованным путём (сами пересобирают свежий
        # ai-base ЛОКАЛЬНО перед сборкой рабочего образа); голый `docker compose build
        # worker-ai` — фолбэк, тянущий AI_BASE_IMAGE из Harbor через ARG-дефолт ниже.
        build:
            context: .
            dockerfile: docker/workers/ai.${AI_VARIANT:-cpu}.Dockerfile
            args:
                AI_BASE_IMAGE: ${AI_BASE_IMAGE:-harbor.xakki.ru/convertor/worker-ai-base:latest}
                APP_UID: ${APP_UID:-1000}
                APP_GID: ${APP_GID:-1000}
        image: ${IMAGE_NS}/worker-ai:${IMAGE_TAG:-latest}-${AI_VARIANT:-cpu}
        # Отдельный knob от WORKER_PULL_POLICY: worker-ai:cuda в Harbor НЕ публикуется
        # (§1), поэтому если бы GPU-хост наследовал общий WORKER_PULL_POLICY=always,
        # compose пытался бы пуллить несуществующий worker-ai:latest-cuda → та же
        # ошибка "pull access denied", которую чинит эта задача, просто в другом месте.
        # ВАЖНО: значение по умолчанию `missing` тут — фолбэк ТОЛЬКО для `up` (при
        # отсутствии локального образа missing запускает build:-секцию). Explicit
        # `docker compose pull`/`make pull` build-фолбэка не знает: с `missing` он
        # всё равно пытается запросить worker-ai:latest-cuda и падает (exit 2,
        # "not found"). GPU-хост обязан явно ставить `AI_PULL_POLICY=build` в
        # .env.local (.env.local_worker_example) — тогда `docker compose pull`
        # помечает сервис Skipped, а `up`/`workers-recreate` по-прежнему собирают
        # локально. Проверено эмпирически на обоих значениях.
        pull_policy: ${AI_PULL_POLICY:-missing}
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ai"
        # Профиль `ai` (COMPOSE_PROFILES в .env) — тяжёлый образ, тест-стенд его не поднимает.
        profiles: ["ai"]
        # Стабильный hostname → стабильный auto-derived WORKER_ID (см. ws_client.py
        # _default_worker_id, §6.1): без пиннинга каждое пересоздание контейнера
        # получало бы новое имя KeyDB-consumer'а (мирроим hostname-паттерн php/cron
        # в основном docker-compose.yml).
        hostname: "${COMPOSE_PROJECT_NAME:-convertor}-worker-ai"
        restart: unless-stopped
        init: true
        stop_grace_period: 60s
        stop_signal: SIGTERM
        # runc (дефолт) на CPU-хосте; nvidia на GPU-хосте вместе с AI_VARIANT=cuda
        # (докер-runtime, нужный для --gpus/CUDA-доступа внутри контейнера).
        runtime: ${AI_RUNTIME:-runc}
        # ВНИМАНИЕ: 1G снят в idle-окно (QW1b). AI-инференс грузит ML-модели
        # (Whisper + embedding + llama.cpp GGUF) в RAM — при реальной нагрузке
        # поднять память, иначе OOM убьёт задачу в полёте.
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "1"
                    memory: "1G"
        volumes:
            # Named volume for HuggingFace model cache (Whisper, embedding weights).
            - worker-ai-models:/home/app/.cache/huggingface
            # Dev-server settings overlay — must survive restart (NOT under WORK_DIR/tempdir).
            # Used only by `python -m workers.ai --devserver`; see ai-worker-devserver.
            - worker-ai-data:/data
            # Alternative: bind-mount already-downloaded weights from the host (no re-download):
            # - ${HF_CACHE_HOST:-~/.cache/huggingface}:/home/app/.cache/huggingface
            # Ollama sidecar weights (only needed when running an Ollama sidecar inside the
            # container — NOT for the default external-Ollama path via OLLAMA_URL).
            # Note: container runs as uid 1000 (app); /root/.ollama may not be writable.
            # - ${OLLAMA_HOME:-~/.ollama}:/root/.ollama
        environment:
            WORKER_MODULE: workers.ai.worker
            # Pull-API (required)
            API_BASE_URL: ${API_BASE_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            WORKER_TYPE: ${WORKER_TYPE:-ai}
            # registry-08: см. комментарий у worker-libreoffice выше.
            WORKER_HOST: ${HOST_NAME}
            # WS-транспорт (prod worker mode): без явного GATEWAY_WS_URL воркер падает
            # обратно на публичный wss://…/ws/worker/, зашитый в workers/ai/worker.py
            # (_run_with_signals default_gateway_ws_url) — годится для remote-хоста, но
            # worker-ai теперь обычный сервис в этом же docker-compose.yml (рядом с
            # worker-data и др.) и берёт внутренний адрес из корневого .env.
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            # Рабочий каталог для временных файлов конвертации (см. worker-data/др.).
            WORK_DIR: /tmp/worker
            # STT
            WHISPER_MODEL: ${WHISPER_MODEL:-base}
            # Пустой фолбэк (не cpu/int8!) — иначе compose-env забивает автодетект в
            # workers/ai/config.py (_autodetect_device). Пусто → воркер сам определит
            # cuda+float16 при видимом GPU, иначе cpu+int8.
            WHISPER_DEVICE: ${WHISPER_DEVICE:-}
            WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-}
            STREAM_WINDOW_SEC: ${STREAM_WINDOW_SEC:-20}
            STREAM_OVERLAP_SEC: ${STREAM_OVERLAP_SEC:-2}
            # TTS
            TTS_ENGINE: ${TTS_ENGINE:-espeak}
            # Embedding
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
            # LLM text→text — local only. Default = embedded llama.cpp over a HF GGUF
            # (self-contained, no external server). Switch LLM_BACKEND=ollama to use a
            # self-hosted Ollama server instead.
            LLM_BACKEND: ${LLM_BACKEND:-llamacpp}
            # llamacpp: pull the GGUF from a HF repo on first use (cached in the models volume).
            LLM_MODEL_REPO: ${LLM_MODEL_REPO:-Qwen/Qwen2.5-0.5B-Instruct-GGUF}
            LLM_MODEL_FILE: ${LLM_MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
            OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
            # llamacpp alt: a local GGUF path instead of LLM_MODEL_REPO (takes precedence if set).
            LLM_MODEL_PATH: ${LLM_MODEL_PATH:-}
            LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
            LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
            LLM_SYSTEM_PROMPT: ${LLM_SYSTEM_PROMPT:-}
            # Dev-server (only used when overriding command to `python -m workers.ai --devserver`).
            # Persist overlay on the worker-ai-data volume. A single DEVSERVER_PORT drives both
            # the uvicorn listen port and the published port below. To reach it from the host you
            # must also set DEVSERVER_HOST=0.0.0.0 (the in-container default 127.0.0.1 is loopback-only).
            DEVSERVER_CONFIG_PATH: ${DEVSERVER_CONFIG_PATH:-/data/devserver_settings.json}
            DEVSERVER_HOST: ${DEVSERVER_HOST:-127.0.0.1}
            DEVSERVER_PORT: ${DEVSERVER_PORT:-8877}
            DEVSERVER_TOKEN: ${DEVSERVER_TOKEN:-}
            # WS Origin allowlist (anti-CSWSH). Localhost is always allowed; when reaching the
            # dev-server off-loopback or via the nginx /worker-ai/ subpath, add the public origin(s)
            # here (comma-separated, no path), else the /ws/stream handshake is rejected (1008).
            #   e.g. DEVSERVER_ALLOWED_ORIGINS=https://convertor.xakki.pro
            DEVSERVER_ALLOWED_ORIGINS: ${DEVSERVER_ALLOWED_ORIGINS:-}
        # PROD worker mode (заменяет dev-UI, 2026-07-20): подключается к ws-gateway и
        # реально обрабатывает conv.ai задачи — как остальные on-server воркеры в
        # основном docker-compose.yml. Раньше здесь стоял `--devserver` (FastAPI UI +
        # in-process WS-client), который по дизайну НЕ подключается к gateway и не
        # берёт задачи; nginx-роут /worker-ai/ и DEVSERVER_* env ниже больше не
        # обслуживают прод-трафик — оставлены как заглушённая опция для локальной
        # отладки (см. закомментированный роут в docker/nginx/*/conf.d/default.conf).
        # Чтобы вернуть dev-UI вручную: command: ["python3", "-m", "workers.ai", "--devserver"].
        command: ["python3", "-m", "workers.ai"]
        #   ports: ["${DEVSERVER_PORT:-8877}:${DEVSERVER_PORT:-8877}"]   # only for --devserver + direct host curl
        # Uncomment for CUDA GPU support (nvidia-container-toolkit required on host):
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   count: 1
        #                   capabilities: [gpu]
        healthcheck:
            test: ["CMD", "python3", "-c", "import faster_whisper; print('ok')"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 60s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    worker-data:
        build:
            context: .
            dockerfile: docker/workers/data.Dockerfile
        image: ${IMAGE_NS}/worker-data:${IMAGE_TAG:-latest}
        pull_policy: ${WORKER_PULL_POLICY:-missing}
        container_name: "${COMPOSE_PROJECT_NAME}-worker-data"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            WORKER_MODULE: workers.data.worker
            WORKER_ID: ${COMPOSE_PROJECT_NAME:-convertor}-worker-data
            WORKER_TYPE: data
            # registry-08: см. комментарий у worker-libreoffice выше.
            WORKER_HOST: ${HOST_NAME}
            GATEWAY_WS_URL: ${GATEWAY_WS_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            API_BASE_URL: ${API_BASE_URL}
            WORK_DIR: /tmp/worker
        healthcheck:
            test: ["CMD", "python3", "-c", "import pandas, yaml, lxml; print('ok')"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        # default: reaches gateway (public wss://) + Symfony API (http://nginx).
        networks:
            - default

    ws-gateway:
        build:
            context: .
            dockerfile: docker/workers/gateway.Dockerfile
        image: ${IMAGE_NS}/ws-gateway:${IMAGE_TAG:-latest}
        pull_policy: ${WORKER_PULL_POLICY:-missing}
        profiles: ["server"]
        container_name: "${COMPOSE_PROJECT_NAME}-ws-gateway"
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            WS_BLOCK_MS: ${WS_BLOCK_MS}
            WS_HOST: ${WS_HOST}
            WS_PORT: ${WS_PORT}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            WS_RESULT_INLINE_MAX: ${WS_RESULT_INLINE_MAX}
            GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_TOKEN}
            SYMFONY_INTERNAL_URL: ${SYMFONY_INTERNAL_URL}
            WS_PING_INTERVAL_S: ${WS_PING_INTERVAL_S}
            WS_LIVENESS_MISSED_PINGS: ${WS_LIVENESS_MISSED_PINGS}
            WS_RECONNECT_BACKOFF_BASE_S: ${WS_RECONNECT_BACKOFF_BASE_S}
            WS_RECONNECT_BACKOFF_MAX_S: ${WS_RECONNECT_BACKOFF_MAX_S}
            WS_RECONNECT_BACKOFF_FACTOR: ${WS_RECONNECT_BACKOFF_FACTOR}
            RECLAIM_INTERVAL_S: ${RECLAIM_INTERVAL_S:-60}
            RECLAIM_BATCH: ${RECLAIM_BATCH:-10}
            RECLAIM_IDLE_MS_DOCUMENT: ${RECLAIM_IDLE_MS_DOCUMENT:-300000}
            RECLAIM_IDLE_MS_IMAGE: ${RECLAIM_IDLE_MS_IMAGE:-120000}
            RECLAIM_IDLE_MS_AUDIO: ${RECLAIM_IDLE_MS_AUDIO:-300000}
            RECLAIM_IDLE_MS_VIDEO: ${RECLAIM_IDLE_MS_VIDEO:-600000}
            RECLAIM_IDLE_MS_DATA: ${RECLAIM_IDLE_MS_DATA:-180000}
            RECLAIM_IDLE_MS_AI: ${RECLAIM_IDLE_MS_AI:-300000}
            # Liveness push + авторитетный снапшот (registry-06/09). Период
            # пуша обязан быть заметно МЕНЬШЕ окна тишины Symfony
            # (WORKER_LIVENESS_SILENCE_SECONDS, дефолт 120): иначе живой воркер
            # будет гаситься между пушами.
            LIVENESS_PUSH_INTERVAL_S: ${LIVENESS_PUSH_INTERVAL_S:-30}
            LIVENESS_SNAPSHOT_WARMUP_S: ${LIVENESS_SNAPSHOT_WARMUP_S:-60}
            LIVENESS_REREGISTER_COOLDOWN_S: ${LIVENESS_REREGISTER_COOLDOWN_S:-300}
            GATEWAY_ID: ${GATEWAY_ID:-}
        depends_on:
            keydb:
                condition: service_healthy
        # backend: единственный читатель keydb (XREADGROUP/XACK/XAUTOCLAIM);
        # default: публичный фронт (nginx /ws/worker/) + egress к Symfony (internal relay).
        networks:
            - backend
            - default

    metrics-exporter:
        build:
            context: .
            dockerfile: docker/workers/metrics_exporter.Dockerfile
        image: ${IMAGE_NS}/metrics-exporter:${IMAGE_TAG:-latest}
        pull_policy: ${WORKER_PULL_POLICY:-missing}
        # Имя ЖЁСТКОЕ: Prometheus скрейпит статический таргет convertor-metrics-exporter:9472
        # (dockprom/prometheus.yml) — не переименовывать и не префиксовать проектом.
        container_name: "convertor-metrics-exporter"
        # Профиль `monitoring` (COMPOSE_PROFILES в .env): из-за жёсткого имени два
        # стенда одновременно его поднять не могут — тест-стенд не поднимает.
        profiles: ["monitoring"]
        restart: unless-stopped
        init: true
        stop_grace_period: 10s
        stop_signal: SIGTERM
        environment:
            APP_ENV: ${APP_ENV}
            TZ: ${TZ}
            REDIS_HOST: ${REDIS_HOST:-keydb}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_DB: ${REDIS_QUEUE_DB:-2}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            CONSUMER_GROUP: ${CONSUMER_GROUP:-convertor}
            METRICS_POLL_INTERVAL: ${METRICS_POLL_INTERVAL:-15}
        depends_on:
            keydb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:9472/metrics"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s
        # backend — reaches keydb; common — scraped by dockprom Prometheus.
        # No host port: internal scrape only via convertor-metrics-exporter:9472.
        networks:
            - backend
            - common

networks:
    default:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-network"
    backend:
        driver: bridge
        name: "${COMPOSE_PROJECT_NAME}-backend"
        internal: true
    common:
        external: true
        name: common

volumes:
    mariadb-data:
        name: "${COMPOSE_PROJECT_NAME}-mariadb-data"
    keydb-data:
        name: "${COMPOSE_PROJECT_NAME}-keydb-data"
    php-socket:
        name: "${COMPOSE_PROJECT_NAME}-php-socket"
    worker-ai-models:
        name: "worker-ai-models"
    worker-ai-data:
        name: "worker-ai-data"
