<!-- HTMX partial: quota bar fragment (CNV-30 — 4 тира × 2 окна) -->
<!-- Данные: GET /api/v1/quota → JSON { plan, tiers, max_upload_bytes } -->
<!-- Подключается из dashboard.html; самостоятельно фетчит API через quotaBar(). -->

<div
  class="quota-bar space-y-4"
  role="region"
  aria-label="Квота конвертаций"
  x-data="quotaBar()"
  x-init="load()"
  x-cloak
>
  <template x-if="!loaded">
    <div class="space-y-3" aria-hidden="true">
      <template x-for="i in 4" :key="i">
        <div>
          <div class="mb-1.5 flex justify-between text-sm">
            <div class="h-4 w-20 animate-pulse rounded bg-zinc-700"></div>
            <div class="h-4 w-12 animate-pulse rounded bg-zinc-700"></div>
          </div>
          <div class="h-2 w-full overflow-hidden rounded-full bg-zinc-700">
            <div class="h-full w-1/3 animate-pulse rounded-full bg-indigo-500/40"></div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <template x-if="loaded">
    <div class="space-y-4">
      <div class="flex items-center justify-between text-xs text-zinc-500">
        <span>План: <span class="font-medium text-zinc-300" x-text="planLabel"></span></span>
        <span>Макс. файл: <span class="font-medium text-zinc-300" x-text="humanSize(maxUploadBytes)"></span></span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full min-w-[16rem] text-xs">
          <thead>
            <tr class="text-left text-zinc-500">
              <th class="pb-1.5 pr-3 font-normal">Тир</th>
              <th class="pb-1.5 pr-3 font-normal">День</th>
              <th class="pb-1.5 font-normal">Месяц</th>
            </tr>
          </thead>
          <tbody class="text-zinc-300">
            <template x-for="tier in tierOrder" :key="tier">
              <tr>
                <td class="py-1 pr-3">
                  <span class="flex items-center gap-1">
                    <span x-text="tierLabel(tier)"></span>
                    <template x-if="isTierLocked(tier)">
                      <svg class="h-3 w-3 text-zinc-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                      </svg>
                    </template>
                  </span>
                </td>
                <td class="py-1 pr-3 font-medium tabular-nums" x-text="windowLine(tier, tiers[tier]?.daily)"></td>
                <td class="py-1 font-medium tabular-nums" x-text="windowLine(tier, tiers[tier]?.monthly)"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Daily progress — только light (основной тир) -->
      <div>
        <div class="mb-1.5 flex items-center justify-between text-sm">
          <span class="text-zinc-400">Лёгкие (день)</span>
          <span class="font-medium text-white tabular-nums">
            <span class="text-indigo-400" x-text="tiers?.light?.daily?.used ?? 0"></span>
            <span class="text-zinc-600">/</span>
            <span x-text="limitDisplay(tiers?.light?.daily?.limit)"></span>
          </span>
        </div>
        <div
          class="h-2 w-full overflow-hidden rounded-full bg-zinc-700"
          role="progressbar"
          :aria-valuenow="tiers?.light?.daily?.used ?? 0"
          aria-valuemin="0"
          :aria-valuemax="tiers?.light?.daily?.limit === -1 ? 100 : (tiers?.light?.daily?.limit ?? 0)"
          aria-label="Использовано лёгких конвертаций за день"
        >
          <div
            class="h-full rounded-full bg-indigo-500 transition-all duration-500"
            :style="'width:' + dailyPercent('light') + '%'"
          ></div>
        </div>
      </div>
    </div>
  </template>
</div>
