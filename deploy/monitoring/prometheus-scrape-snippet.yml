# Snippet for dockprom Prometheus (`/home/soft/dockprom/prometheus/prometheus.yml`).
# Already applied on the shared stack; keep this file as the in-repo reference.
#
# Also ensure rule_files includes:
#   - "convertor.rules"
# (copy deploy/monitoring/convertor.rules → prometheus/convertor.rules, then reload).

  # Convertor service — KeyDB Streams metrics exporter
  # Container in docker network "common"; Prometheus resolves by container name.
  - job_name: 'convertor-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['convertor-metrics-exporter:9472']
        labels:
          service: 'convertor'
