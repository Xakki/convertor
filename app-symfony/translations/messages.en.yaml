# home-06-legal-docs: /privacy и /terms (templates/legal/*.html.twig) +
# cookie-consent баннер (partials/_cookie_consent.html.twig). Контент сверен
# со skill redesign-auth-access-contract — описывает только реально
# собираемые данные, ничего не выдумываем.
legal:
    updated_on: 'Last updated: July 21, 2026.'
    privacy:
        title: 'Privacy Policy — File Converter'
        heading: 'Privacy Policy'
        intro: 'This page explains what data File Converter collects when you use the file-conversion service, why, and who else can see it.'
        data_heading: 'What we collect'
        data_guest_cookie: '`guest_id` cookie — an httpOnly, signed identifier that lets you use the conversion service anonymously (as a guest) without creating an account, and lets us associate your conversions and history with that anonymous identity.'
        data_locale_cookie: '`locale` cookie — remembers your chosen interface language (English/Russian).'
        data_consent_cookie: '`cookie_consent` cookie — remembers your choice ("Accept"/"Decline") in the cookie notice. The cookie itself is strictly necessary (it only stores the choice you made), but the optional convenience it unlocks — showing your conversion history on this device below the form on the homepage — only works if you choose "Accept". Choosing "Decline" simply hides that history; converting files itself does not depend on this choice and works identically either way.'
        data_oauth: 'Account profile data — if you sign in via Telegram or an OAuth provider (Google, GitHub, Yandex, VK), we receive and store basic profile information from that provider: your Telegram ID/username or, for OAuth, a verified email address, display name, username and avatar (exact fields depend on the provider). We also set an httpOnly session/refresh-token cookie to keep you signed in.'
        data_session_cookie: 'Sign-in session cookies — a short-lived `tg_login_nonce` cookie during Telegram sign-in, and an httpOnly refresh-token cookie after a successful sign-in, both strictly necessary to complete and maintain the login.'
        data_files: 'Uploaded files and conversion results — stored temporarily in our S3-compatible object storage while your conversion is processed and available for download, then automatically deleted (as soon as 24 hours for anonymous/guest use; longer, depending on your plan, for signed-in accounts).'
        data_no_tracking: 'We do not use analytics, advertising or third-party tracking cookies. All cookies listed above are strictly necessary to operate the conversion service itself.'
        purpose_heading: 'Why we process this data'
        purpose_text: 'Solely to provide the file-conversion service: identifying your conversions (as a guest or a signed-in user), keeping you signed in, remembering your language choice, storing your files while they are converted, and enforcing usage limits.'
        processors_heading: 'Who else processes this data'
        processors_text: 'Uploaded files and results are stored in our S3/MinIO-compatible object storage. If you sign in via Telegram, the Telegram Bot API is used to deliver the sign-in link. If you sign in via an OAuth provider, that provider (Google, GitHub, Yandex or VK) processes the sign-in exchange on its side. We do not sell or share your data with any other third party.'
        retention_heading: 'How long we keep data'
        retention_text: 'Uploaded files and conversion results are deleted automatically — within 24 hours for anonymous/guest usage, and after a longer period (up to 30 days) for signed-in accounts, depending on your plan. Sign-in cookies expire automatically (`guest_id` — 30 days after it is issued; the Telegram sign-in nonce — 5 minutes).'
        rights_heading: 'Your rights'
        rights_text: 'At this stage (MVP) the product does not yet offer a self-service page to export or delete your account and data. To request access to, or deletion of, your data, please contact us — see Contact below — and we will handle it manually.'
        contact_heading: 'Contact'
        contact_text: 'Questions about this policy, or requests regarding your data — message our Telegram bot:'
    terms:
        title: 'Terms of Use — File Converter'
        heading: 'Terms of Use'
        intro: 'These terms govern your use of File Converter. By using the service — with or without an account — you agree to them.'
        service_heading: 'The service'
        service_text: 'File Converter lets you upload a file (or, for some formats, paste text) and convert it to another format. Some conversions can be used anonymously as a guest; conversions that use AI processing or produce video require signing in.'
        limits_heading: 'Limits and plans'
        limits_text: 'The service enforces daily conversion quotas and a maximum upload size per plan (free vs. paid); current values are shown on the home page under “Limits and pricing”. We may adjust these limits as the service evolves.'
        acceptable_use_heading: 'Acceptable use'
        acceptable_use_text: 'You agree not to:'
        acceptable_use_item_illegal: 'Upload content that is illegal, infringes someone else’s rights, or that you do not have the right to process.'
        acceptable_use_item_abuse: 'Attempt to bypass usage limits, automate mass usage of the service outside of the documented API contract, or interfere with the service’s operation.'
        acceptable_use_item_rights: 'Use the service to violate the privacy, intellectual property or other rights of any third party.'
        no_warranty_heading: 'No warranty'
        no_warranty_text: 'The service is provided “as is”, without warranties of any kind, express or implied. We do not guarantee uninterrupted availability or that every conversion will produce a perfect result. To the maximum extent permitted by law, we are not liable for any damages arising from your use of the service.'
        changes_heading: 'Changes'
        changes_text: 'This is an early-stage (MVP) product; the service and these terms may change as it evolves. Material changes will be reflected on this page.'
        contact_heading: 'Contact'
        contact_text: 'Questions about these terms — message our Telegram bot:'

# home-06-legal-docs: informational cookie-consent banner (partials/
# _cookie_consent.html.twig) / home-12-guest-history-consent. Every cookie the
# service sets (guest_id, locale, consent, sign-in session) is strictly
# necessary to run the service — see legal.privacy — and is set regardless of
# the choice made here. The accepted/declined choice gates ONLY an optional
# convenience: showing your guest conversion history on this device (see
# converterApp() readConsent()).
cookie_consent:
    message: 'We use cookies that are strictly necessary to run this service (identifying your session, remembering your language). We separately ask for your consent to show your conversion history on this device — if you decline, converting files still works exactly the same.'
    privacy_link: 'Learn more in our Privacy Policy'
    accept: 'Accept'
    decline: 'Decline'

# home-09-seo-conversion-pages: SEO landing per conversion pair
# (templates/conversion/pair.html.twig, App\Controller\Web\ConversionPageController,
# route app_conversion_pair). %from%/%to% are interpolated with the pair's
# format codes (uppercased) from the URL — structural SEO only, no keyword
# copywriting tuning (that is an explicit follow-up, see the card).
pair:
    title: 'Convert %from% to %to% online — %brand%'
    meta_description: 'Convert %from% to %to% online for free, right in your browser. Fast, secure and no installation required — drop your file (or paste text, if supported) below to get started.'
    h1: 'Convert %from% to %to%'
    subheading: 'Free online %from% → %to% converter. Upload a file (or paste text, if the format supports it) below and download the result in seconds.'
    about_heading: 'About %from% to %to% conversion'
    about_body: 'This converter turns %from% files into %to% format through the same conversion pipeline as the rest of the service — no separate tool, no quality loss beyond what the format change itself requires. It works for guests too (AI-powered and video conversions are the only exception — those require signing in), so you can try it right away.'
    back_to_home: '← All conversions'
