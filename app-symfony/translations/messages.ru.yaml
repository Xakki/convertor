    close: 'Закрыть'
    download: 'Скачать'
    loading: 'Загрузка…'
    locale_switch_en: 'EN'
    locale_switch_ru: 'RU'

home:
    title: 'Конвертер файлов — загрузка и конвертация'
    # home-03: витрина категорий/пар форматов из /api/v1/formats, до формы.
    showcase_heading: 'Что умеет конвертировать сервис'
    showcase_subheading: 'Выберите пару форматов — она подставится в форму ниже'
    showcase_ai_badge: 'AI'
    showcase_more: 'и ещё %count%'
    category:
        document: 'Документы'
        image: 'Изображения'
        audio: 'Аудио'
        video: 'Видео'
        data: 'Данные'
        archive: 'Архивы'
        markup: 'Разметка'
    # home-04/home-11: матрица форматов (клиентски из /api/v1/formats, см.
    # геттер formatMatrix) + статичный блок лимитов/тарифов.
    formats:
        heading: 'Поддерживаемые форматы'
        subheading: 'Матрица конвертаций, доступных в MVP (Стадия 1)'
        col_category: 'Категория'
        col_source: 'Исходные форматы'
        col_target: 'Целевые форматы'
    # home-13: живой виджет квот текущего юзера над формой (GET /api/v1/quota),
    # виден и гостю, и залогиненному — отдельно от статичной таблицы лимитов/
    # тарифов ниже (та сравнивает планы, этот — живые данные по юзеру).
    quota:
        plan_label: 'План'
        conversions_label: 'Конвертаций сегодня'
        ai_label: 'AI сегодня'
        max_file_label: 'Макс. размер файла'
        ai_guest_note: 'нужен вход'
        guest_locked_note: 'Видео и AI недоступны без входа.'
        tier_col: 'Тир'
        tier_light: 'Лёгкие'
        tier_medium: 'Средние'
        tier_heavy: 'Видео'
        tier_ai: 'AI'
        window_daily: 'День'
        window_monthly: 'Месяц'
        plan_free: 'Free'
        plan_basic: 'Basic'
        plan_pro: 'Pro'
        plan_guest: 'Гость'
    limits:
        heading: 'Лимиты и тарифы'
        subheading: 'Что сервис реально применяет по планам сегодня'
        # 4-тировая суточно+месячная модель из ROADMAP пока не реализована;
        # QuotaService применяет только эти суточные счётчики + макс. размер.
        proposal_note: 'Детальные пер-тировые суточные/месячные квоты — будущее предложение (plan-quota-daily-monthly); ниже — значения, которые сервис применяет сейчас.'
        col_param: 'Параметр'
        conversions_day: 'Конвертаций / день'
        ai_day: 'AI-конвертаций / день'
        max_file: 'Макс. размер файла'
        price_month: 'Цена / мес'
        unlimited: 'Без лимита'
    # home-04: живые примеры из реального пайплайна, лежат в S3.
    # home-10: view/download убраны — вместо текстовых кнопок теперь кликабельные
    # иконки файла (превью или скачивание по клику, см. _converter_examples.html.twig).
    examples:
        heading: 'Живые примеры конвертаций'
        subheading: 'Реальные результаты из пайплайна конвертации — загружать файл не нужно'
    # home-01: /login предлагает несколько провайдеров (Telegram — один из
    # них), поэтому текст больше не называет Telegram явно.
    ai_gate_message: 'Для ai/video конвертаций нужен вход.'
    dropzone_hint: 'Перетащите файл сюда или нажмите, чтобы выбрать'
    source_format_label: 'Исходный формат'
    target_format_label: 'Целевой формат'
    format_placeholder: '— выберите формат —'
    # home-02: переключатель режима ввода (Файл / Текст) над формой.
    input_mode_file: 'Файл'
    input_mode_text: 'Текст'
    text_placeholder: 'Вставьте текст для конвертации…'
    ocr_label: 'Распознать текст (OCR)'
    submit_button: 'Конвертировать'
    submit_sending: 'Отправка…'
    job_prefix: 'Задача #'
    job_processing: 'Обработка…'
    download_result: 'Скачать результат'
    # CNV-71-03: «expired» здесь = принятую задачу никто из воркеров не забрал
    # в течение окна ожидания (WORKER_CLAIM_TIMEOUT_MINUTES) — НЕ протухание
    # уже готового результата (для этого своя механика, см. preview.gone /
    # dashboard.history.error.expired). Явно упоминаем возврат оплаты (AC).
    error_expired: 'Ни один воркер не успел взять задачу в отведённое время ожидания. Конвертация отменена, оплата возвращена — попробуйте позже.'
    error_failed: 'Конвертация не удалась'
    # CNV-71-03: клиентский поллинг сдался через ~5 минут (не путать с
    # error_expired выше — это реальный серверный таймаут WORKER_CLAIM_TIMEOUT_MINUTES,
    # времени ожидания). Задача НЕ провалилась — она всё ещё в очереди, честно об этом
    # говорим и НЕ выводим статус/цвет ошибки (см. FAILED_STATUSES в JS).
    poll_gave_up_message: 'Задача всё ещё в очереди — сервер может обрабатывать её ещё до %timeout_minutes% мин. Результат появится в истории конвертаций, когда будет готов, обновлять страницу не нужно.'
    history_heading: 'Мои конвертации'
    # CNV-61: кнопка/ссылка рядом с «Конвертировать» → /history.
    history_link: 'Мои конвертации'
    # home-12: заголовок/подпись гостевой истории (без входа) — отдельная
    # формулировка, честно объясняющая, что это НЕ синхронизированная
    # серверная история пользователя, а cookie-scoped список на этом
    # устройстве/браузере (доступен только пока принята cookie_consent).
    history_heading_guest: 'История на этом устройстве'
    history_guest_note: 'Видна только в этом браузере благодаря cookie — не сохраняется на других устройствах.'
    history_source: 'Исходник'
    history_source_gone: 'исходник удалён'
    history_preview: 'Просмотр'
    duration_prefix: 'за '
    preview_title: 'Предпросмотр результата'
    preview_truncated: 'Показаны первые 64 КБ — скачайте целиком.'
    status:
        pending: 'В очереди'
        processing: 'Обработка'
        completed: 'Готово'
        failed: 'Ошибка'
        expired: 'Истёк'
        # CNV-71-03: клиентский псевдо-статус после ~5-минутного капа поллинга —
        # см. poll_gave_up_message выше и POLL_GAVE_UP_STATUS в _converter_app_script.
        poll_gave_up: 'Ещё в очереди'
    error:
        login_invalid_link: 'Ссылка недействительна, начните вход заново.'
        formats_load_failed: 'Не удалось загрузить список форматов'
        telegram_start_failed: 'Не удалось начать вход через Telegram (%status%).'
        telegram_network: 'Сетевая ошибка при входе через Telegram.'
        telegram_expired: 'Код входа истёк. Начните вход заново.'
        session_expired: 'Сессия истекла, войдите заново. Задача сброшена, повторите после входа.'
        upload_network: 'Сетевая ошибка при отправке файла'
        # home-02: клиентская soft-валидация text-режима (сервер всё равно
        # проверяет размер по лимиту плана — см. status_413).
        text_required: 'Введите текст для конвертации'
        text_too_large: 'Текст слишком большой (превышен лимит в %mb% МБ)'
        status_401: 'Сессия истекла, войдите заново.'
        status_413: 'Файл слишком большой (превышен лимит размера).'
        status_415: 'Неподдерживаемый тип файла.'
        status_422: 'Такая конвертация не поддерживается.'
        status_429: 'Превышена дневная квота или слишком много запросов.'
        # CNV-71-03: 503 worker_unavailable — для нужного типа воркера ещё
        # никогда не было строки в worker_capabilities (не путать с
        # conversion_disabled — там пара валидна, просто выключена админом).
        worker_unavailable: 'Конвертация временно недоступна — такой тип конвертации сейчас не поддерживается ни одним воркером. Попробуйте позже.'
        # CNV-71-03: 409 conversion_disabled — пара валидна, но временно
        # выключена админом (не путать с worker_unavailable выше).
        conversion_disabled: 'Эта конвертация временно отключена администратором. Попробуйте позже.'
        generic_status: 'Ошибка %status%'
        download_failed: 'Не удалось скачать результат'
        download_network: 'Сетевая ошибка при скачивании'
        source_download_failed: 'Не удалось скачать исходник'
        source_download_network: 'Сетевая ошибка при скачивании исходника'
        preview_failed: 'Не удалось загрузить предпросмотр'
        preview_network: 'Сетевая ошибка при загрузке предпросмотра'
    units:
        bytes: 'Б'
        kb: 'КБ'
        mb: 'МБ'
        ms: 'мс'
        sec: 'с'

