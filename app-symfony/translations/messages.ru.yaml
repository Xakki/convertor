# i18n-фундамент (home-07). Структура и порядок ключей — 1:1 с messages.en.yaml
# (см. комментарий там про namespace common.*/home.*/login.*/nav.*/footer.*).
common:
    brand: 'Конвертер файлов'
    login_telegram: 'Войти через Telegram'
    login_telegram_opening: 'Открываем Telegram…'
    login_telegram_waiting: 'Ждём подтверждение…'
    login_hint: 'Продолжите в Telegram: нажмите «Войти», затем вернитесь на эту вкладку — вход завершится сам.'
