# home-06-legal-docs: /privacy и /terms (templates/legal/*.html.twig) +
# баннер cookie-consent (partials/_cookie_consent.html.twig). Контент сверен
# со skill redesign-auth-access-contract — описывает только реально
# собираемые данные, ничего не выдумываем.
legal:
    updated_on: 'Обновлено: 21 июля 2026 г.'
    privacy:
        title: 'Политика конфиденциальности — Конвертер файлов'
        heading: 'Политика конфиденциальности'
        intro: 'На этой странице объясняется, какие данные Конвертер файлов собирает при использовании сервиса конвертации, зачем, и кто ещё может их видеть.'
        data_heading: 'Что мы собираем'
        data_guest_cookie: 'Cookie `guest_id` — httpOnly-cookie с подписанным значением, которая позволяет пользоваться сервисом анонимно (как гость) без регистрации и связывает ваши конвертации и историю с этой анонимной личностью.'
        data_locale_cookie: 'Cookie `locale` — запоминает выбранный язык интерфейса (английский/русский).'
        data_consent_cookie: 'Cookie `cookie_consent` — запоминает ваш выбор («Принять»/«Отклонить») в уведомлении о cookie. Сама эта кука строго необходима (хранит только факт выбора), но включённое ею необязательное удобство — показ вашей истории конвертаций на этом устройстве под формой на главной странице — работает только при выборе «Принять». При выборе «Отклонить» история просто не показывается; сама конвертация файлов не зависит от этого выбора и работает одинаково в обоих случаях.'
        data_oauth: 'Данные профиля учётной записи — при входе через Telegram или OAuth-провайдера (Google, GitHub, Yandex, VK) мы получаем и сохраняем базовые данные профиля от этого провайдера: ваш Telegram ID/username, либо для OAuth — подтверждённый email, отображаемое имя, username и аватар (конкретный набор полей зависит от провайдера). Также выставляется httpOnly-cookie сессии/refresh-токена, чтобы сохранять вход.'
        data_session_cookie: 'Cookie сессии входа — короткоживущая cookie `tg_login_nonce` во время входа через Telegram и httpOnly-cookie refresh-токена после успешного входа; обе строго необходимы для завершения и поддержания входа.'
        data_files: 'Загружаемые файлы и результаты конвертации — временно хранятся в нашем S3-совместимом объектном хранилище, пока конвертация обрабатывается и доступна для скачивания, затем автоматически удаляются (уже через 24 часа для анонимного/гостевого использования; дольше, в зависимости от тарифа, для зарегистрированных аккаунтов).'
        data_no_tracking: 'Мы не используем аналитические, рекламные или сторонние трекинговые cookie. Все перечисленные выше cookie строго необходимы для работы самого сервиса конвертации.'
        purpose_heading: 'Зачем мы обрабатываем эти данные'
        purpose_text: 'Исключительно для оказания услуги конвертации файлов: идентификации ваших конвертаций (как гостя или залогиненного пользователя), поддержания входа, запоминания выбранного языка, хранения ваших файлов на время конвертации и применения лимитов использования.'
        processors_heading: 'Кто ещё обрабатывает эти данные'
        processors_text: 'Загружаемые файлы и результаты хранятся в нашем S3/MinIO-совместимом объектном хранилище. При входе через Telegram для доставки ссылки входа используется Telegram Bot API. При входе через OAuth-провайдера (Google, GitHub, Yandex или VK) обмен данными входа обрабатывается на стороне этого провайдера. Мы не продаём и не передаём ваши данные никаким другим третьим лицам.'
        retention_heading: 'Как долго мы храним данные'
        retention_text: 'Загруженные файлы и результаты конвертации удаляются автоматически — в течение 24 часов для анонимного/гостевого использования, и дольше (до 30 дней) для зарегистрированных аккаунтов, в зависимости от тарифа. Cookie входа истекают автоматически (`guest_id` — через 30 дней с момента выдачи; nonce входа через Telegram — через 5 минут).'
        rights_heading: 'Ваши права'
        rights_text: 'На текущем этапе (MVP) продукт ещё не предлагает страницу самообслуживания для экспорта или удаления вашего аккаунта и данных. Чтобы запросить доступ к вашим данным или их удаление, свяжитесь с нами — см. раздел «Контакты» ниже — мы обработаем запрос вручную.'
        contact_heading: 'Контакты'
        contact_text: 'Вопросы об этой политике или запросы по вашим данным — напишите нашему боту в Telegram:'
    terms:
        title: 'Условия использования — Конвертер файлов'
        heading: 'Условия использования'
        intro: 'Эти условия регулируют использование Конвертера файлов. Используя сервис — с аккаунтом или без — вы соглашаетесь с ними.'
        service_heading: 'Сервис'
        service_text: 'Конвертер файлов позволяет загрузить файл (либо, для некоторых форматов, вставить текст) и конвертировать его в другой формат. Часть конвертаций доступна анонимно, как гостю; конвертации с использованием AI-обработки или в видео-формат требуют входа.'
        limits_heading: 'Лимиты и тарифы'
        limits_text: 'Сервис применяет суточные квоты на конвертации и максимальный размер загружаемого файла по тарифу (бесплатный/платный); актуальные значения показаны на главной странице в разделе «Лимиты и тарифы». Мы можем изменять эти лимиты по мере развития сервиса.'
        acceptable_use_heading: 'Допустимое использование'
        acceptable_use_text: 'Вы соглашаетесь не:'
        acceptable_use_item_illegal: 'Загружать контент, который незаконен, нарушает чужие права, либо который вы не вправе обрабатывать.'
        acceptable_use_item_abuse: 'Пытаться обойти лимиты использования, автоматизировать массовое использование сервиса за пределами документированного API-контракта или мешать работе сервиса.'
        acceptable_use_item_rights: 'Использовать сервис для нарушения приватности, интеллектуальных или иных прав третьих лиц.'
        no_warranty_heading: 'Отказ от гарантий'
        no_warranty_text: 'Сервис предоставляется «как есть» (as is), без каких-либо гарантий, явных или подразумеваемых. Мы не гарантируем бесперебойную доступность или идеальный результат каждой конвертации. В максимально допустимых законом пределах мы не несём ответственности за убытки, возникшие в связи с использованием сервиса.'
        changes_heading: 'Изменения'
        changes_text: 'Это продукт на раннем этапе (MVP); сервис и эти условия могут меняться по мере развития. Существенные изменения будут отражены на этой странице.'
        contact_heading: 'Контакты'
        contact_text: 'Вопросы по этим условиям — напишите нашему боту в Telegram:'

# home-06-legal-docs / home-12-guest-history-consent: баннер cookie-consent
# (partials/_cookie_consent.html.twig). Все cookie сервиса (guest_id, locale,
# consent, сессия входа) строго необходимы для работы сервиса — см.
# legal.privacy — и ставятся независимо от выбора здесь. Выбор
# accepted/declined гейтит ТОЛЬКО необязательное удобство: показ гостевой
# истории конвертаций под формой на главной (см. converterApp() readConsent()).
cookie_consent:
    message: 'Мы используем cookie, строго необходимые для работы сервиса (идентификация сессии, запоминание языка). Отдельно спрашиваем согласие на показ вашей истории конвертаций на этом устройстве — если откажетесь, сама конвертация продолжит работать как обычно.'
    privacy_link: 'Подробнее — в Политике конфиденциальности'
    accept: 'Принять'
    decline: 'Отклонить'

# home-09-seo-conversion-pages: SEO-лендинг под конкретную пару конвертации
# (templates/conversion/pair.html.twig, App\Controller\Web\ConversionPageController,
# роут app_conversion_pair). %from%/%to% подставляются кодами форматов (в
# верхнем регистре) из URL — только структурная SEO-готовность, без подбора
# ключевых слов/копирайта (явный follow-up, см. карточку).
pair:
    title: 'Конвертировать %from% в %to% онлайн — %brand%'
    meta_description: 'Конвертируйте %from% в %to% онлайн бесплатно, прямо в браузере. Быстро, безопасно, без установки — перетащите файл (или вставьте текст, если формат это поддерживает), чтобы начать.'
    h1: 'Конвертировать %from% в %to%'
    subheading: 'Бесплатный онлайн-конвертер %from% → %to%. Загрузите файл (или вставьте текст, если формат это поддерживает) — результат будет готов за секунды.'
    about_heading: 'О конвертации %from% в %to%'
    about_body: 'Этот конвертер переводит файлы %from% в формат %to% через тот же конвейер конвертации, что и остальной сервис — отдельный инструмент не нужен, качество не теряется сверх того, что подразумевает сама смена формата. Работает и для гостей (кроме AI-конвертаций и видео — там нужен вход), так что можно попробовать сразу.'
    back_to_home: '← Все конвертации'
