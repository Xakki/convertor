parameters:
    # Worker pull-API static bearer token (must be set in .env.local for prod)
    env(WORKER_API_TOKEN): ''

    # WS-Gateway internal-relay bearer token (must be set in .env.local for prod)
    env(GATEWAY_INTERNAL_TOKEN): ''

    # Object-key prefix for S3 results (e.g. "dev/" in dev, empty in prod).
    # Distinct from S3_BUCKET_PREFIX which is the bucket name prefix.
    env(S3_PREFIX): ''

    # Refresh-token defaults (optional in every env). DSN = KeyDB db 1 (sessions).
    env(REFRESH_TTL): '2592000'
    env(REFRESH_GRACE): '60'
    env(REFRESH_COOKIE_SECURE): 'true'
    env(REFRESH_COOKIE_SAMESITE): 'lax'
    env(REFRESH_COOKIE_NAME): 'refresh_token'
    env(REDIS_SESSIONS_DSN): 'redis://keydb:6379?dbindex=1'

    # DSN пула `cache.app` (общий Redis-кэш). KeyDB БД 0 — cache (см. CLAUDE.md).
    env(REDIS_CACHE_DSN): 'redis://keydb:6379?dbindex=0'

    # Guest-cookie (`guest_id`) defaults. Secure=true (prod); TTL 30 дней.
    # Секрет подписи — GUEST_COOKIE_SECRET, по умолчанию = APP_SECRET.
    env(GUEST_COOKIE_SECRET): '%env(APP_SECRET)%'
    env(GUEST_COOKIE_SECURE): 'true'
    env(GUEST_COOKIE_TTL): '2592000'

    # URL /metrics существующего metrics-exporter для admin-панели очередей.
    # Дефолт = адрес по внутренней docker-сети backend; не секрет.
    env(METRICS_EXPORTER_URL): 'http://metrics-exporter:9472/metrics'

    # Базовый URL веб-Graylog для линк-аута из admin-панели логов. Пусто по
    # умолчанию (плейсхолдер, не секрет) → UI прячет ссылку «открыть в Graylog».
    env(GRAYLOG_URL): ''

    # Пер-конверсия окно хранения до авто-удаления (Symfony Scheduler, задача
    # file-cleanup-24h-cron). Все значения — часы, не секрет. Разрешение по
    # приоритету осей: status → tariff → category → fallback; первая ось со
    # значением > 0 выигрывает. 0/пусто = ось не настроена, пропустить.
    env(FILE_RETENTION_HOURS): '240'                  # fallback, 240 = 10 суток
    env(FILE_RETENTION_HOURS_STATUS_FAILED): '24'     # ось status: failed
    env(FILE_RETENTION_HOURS_STATUS_EXPIRED): '24'    # ось status: expired
    env(FILE_RETENTION_HOURS_TARIFF_GUEST): '24'      # ось tariff: guest
    env(FILE_RETENTION_HOURS_TARIFF_FREE): '0'        # ось tariff: free (0 → skip)
    env(FILE_RETENTION_HOURS_TARIFF_PAID): '720'      # ось tariff: paid, 720 = 30 суток
    env(FILE_RETENTION_HOURS_CATEGORY_VIDEO): '48'    # ось category: video

    # Доверенные прокси для getClientIp() (guest rate-limit по IP). По умолчанию —
    # приватные диапазоны (Symfony keyword `private_ranges`): доверяем nginx в
    # docker-сети. В проде можно сузить до конкретного адреса фронта.
    env(TRUSTED_PROXIES): 'private_ranges'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Auth\GuestTokenService:
        arguments:
            $secret: '%env(GUEST_COOKIE_SECRET)%'

    App\Service\Auth\GuestCookieFactory:
        arguments:
            $secure: '%env(bool:GUEST_COOKIE_SECURE)%'
            $maxAge: '%env(int:GUEST_COOKIE_TTL)%'

    App\Service\Queue\RedisConnectionFactory:
        arguments:
            $dsn: '%env(REDIS_DSN)%'

    # Separate connection on KeyDB db 1 (sessions) for refresh-token families.
    # Distinct service id → distinct instance, so no db-select bleed with db 2.
    app.redis.sessions:
        class: App\Service\Queue\RedisConnectionFactory
        arguments:
            $dsn: '%env(REDIS_SESSIONS_DSN)%'

    App\Service\Auth\RefreshTokenService:
        arguments:
            $redisFactory: '@app.redis.sessions'
            $appSecret: '%env(APP_SECRET)%'
            $ttl: '%env(int:REFRESH_TTL)%'
            $grace: '%env(int:REFRESH_GRACE)%'

    # One-time Telegram bot-login коды в KeyDB db 1 (sessions), TTL 5 мин.
    App\Service\Auth\TelegramLoginCodeStore:
        arguments:
            $redisFactory: '@app.redis.sessions'
            $ttl: 300

    App\Service\Auth\RefreshCookieFactory:
        arguments:
            $name: '%env(REFRESH_COOKIE_NAME)%'
            $secure: '%env(bool:REFRESH_COOKIE_SECURE)%'
            $sameSite: '%env(REFRESH_COOKIE_SAMESITE)%'
            $maxAge: '%env(int:REFRESH_TTL)%'

    # Cookie `tg_login_nonce` (магик-линк логин). Secure — та же семантика, что и
    # refresh-cookie; TTL = TTL кода (5 мин), задаётся в фабрике по умолчанию.
    App\Service\Auth\TelegramLoginNonceCookieFactory:
        arguments:
            $secure: '%env(bool:REFRESH_COOKIE_SECURE)%'

    AsyncAws\S3\S3Client:
        arguments:
            $configuration:
                endpoint: '%env(S3_ENDPOINT)%'
                accessKeyId: '%env(S3_KEY)%'
                accessKeySecret: '%env(S3_SECRET)%'
                region: '%env(S3_REGION)%'
                pathStyleEndpoint: '%env(bool:S3_USE_PATH_STYLE)%'

    App\Service\Storage\S3Storage:
        arguments:
            $bucketPrefix: '%env(S3_BUCKET_PREFIX)%'

    # Авто-очистка устаревших файлов/строк БД по расписанию (Scheduler).
    # Пороги — пер-конверсия, ключи карт = enum->value (status/category).
    App\Service\Storage\FileCleanupService:
        arguments:
            $defaultRetentionHours: '%env(int:FILE_RETENTION_HOURS)%'
            $statusRetentionHours:
                failed: '%env(int:FILE_RETENTION_HOURS_STATUS_FAILED)%'
                expired: '%env(int:FILE_RETENTION_HOURS_STATUS_EXPIRED)%'
            $tariffRetentionHours:
                guest: '%env(int:FILE_RETENTION_HOURS_TARIFF_GUEST)%'
                free: '%env(int:FILE_RETENTION_HOURS_TARIFF_FREE)%'
                paid: '%env(int:FILE_RETENTION_HOURS_TARIFF_PAID)%'
            $categoryRetentionHours:
                video: '%env(int:FILE_RETENTION_HOURS_CATEGORY_VIDEO)%'

    App\Service\Queue\ConversionResultPersister:
        arguments:
            $resultsBucket: '%env(S3_BUCKET_PREFIX)%-results'

    # Мониторинг очередей admin-панели: URL metrics-exporter'а (остальное — autowire).
    App\Service\Admin\QueueStatsProvider:
        arguments:
            $exporterUrl: '%env(METRICS_EXPORTER_URL)%'

    # Лог конвертаций admin-панели: база-URL Graylog для линк-аута (остальное — autowire).
    App\Controller\Admin\Api\ConversionLogController:
        arguments:
            $graylogUrl: '%env(GRAYLOG_URL)%'
