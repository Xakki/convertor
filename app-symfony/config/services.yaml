parameters:
    # Worker pull-API static bearer token (must be set in .env.local for prod)
    env(WORKER_API_TOKEN): ''

    # WS-Gateway internal-relay bearer token (must be set in .env.local for prod)
    env(GATEWAY_INTERNAL_TOKEN): ''

    # Object-key prefix for S3 results (e.g. "dev/" in dev, empty in prod).
    # Distinct from S3_BUCKET_PREFIX which is the bucket name prefix.
    env(S3_PREFIX): ''

    # Refresh-token defaults (optional in every env). DSN = KeyDB db 1 (sessions).
    env(REFRESH_TTL): '2592000'
    env(REFRESH_GRACE): '60'
    env(REFRESH_COOKIE_SECURE): 'true'
    env(REFRESH_COOKIE_SAMESITE): 'lax'
    env(REFRESH_COOKIE_NAME): 'refresh_token'
    env(REDIS_SESSIONS_DSN): 'redis://keydb:6379?dbindex=1'

    # DSN пула `cache.app` (общий Redis-кэш). KeyDB БД 0 — cache (см. CLAUDE.md).
    env(REDIS_CACHE_DSN): 'redis://keydb:6379?dbindex=0'

    # Guest-cookie (`guest_id`) defaults. Secure=true (prod); TTL 30 дней.
    # Секрет подписи — GUEST_COOKIE_SECRET, по умолчанию = APP_SECRET.
    env(GUEST_COOKIE_SECRET): '%env(APP_SECRET)%'
    env(GUEST_COOKIE_SECURE): 'true'
    env(GUEST_COOKIE_TTL): '2592000'

    # URL /metrics существующего metrics-exporter для admin-панели очередей.
    # Дефолт = адрес по внутренней docker-сети backend; не секрет.
    env(METRICS_EXPORTER_URL): 'http://metrics-exporter:9472/metrics'

    # Базовый URL веб-Graylog для линк-аута из admin-панели логов. Пусто по
    # умолчанию (плейсхолдер, не секрет) → UI прячет ссылку «открыть в Graylog».
    env(GRAYLOG_URL): ''

    # Пер-конверсия окно хранения до авто-удаления (Symfony Scheduler, задача
    # file-cleanup-24h-cron). Все значения — часы, не секрет. Разрешение по
    # приоритету осей: status → tariff → category → fallback; первая ось со
    # значением > 0 выигрывает. 0/пусто = ось не настроена, пропустить.
    env(FILE_RETENTION_HOURS): '240'                  # fallback, 240 = 10 суток
    env(FILE_RETENTION_HOURS_STATUS_FAILED): '24'     # ось status: failed
    env(FILE_RETENTION_HOURS_STATUS_EXPIRED): '24'    # ось status: expired
    env(FILE_RETENTION_HOURS_TARIFF_GUEST): '24'      # ось tariff: guest
    env(FILE_RETENTION_HOURS_TARIFF_FREE): '0'        # ось tariff: free (0 → skip)
    env(FILE_RETENTION_HOURS_TARIFF_PAID): '720'      # ось tariff: paid, 720 = 30 суток
    env(FILE_RETENTION_HOURS_CATEGORY_VIDEO): '48'    # ось category: video

    # Long-TTL GC worker_capabilities (registry-06, Symfony Scheduler, ежечасно).
    # Часы; строки с last_seen старше — удаляются, КРОМЕ seed (instance_id=
    # '__seed__', см. WorkerCapabilityGcService). 168 = 7 суток — "long-TTL":
    # заведомо больше любого разумного окна простоя/деплоя воркера.
    env(WORKER_CAPABILITY_GC_TTL_HOURS): '168'

    # Окно тишины сверки liveness (registry-09, WorkerLivenessReconciler).
    # Секунды; строка со `status=alive`, которую НИ ОДИН gateway не репортил
    # дольше этого срока, гасится в `disconnected`. Совсем другая шкала, чем
    # GC-TTL выше: должно быть заметно больше периода пуша gateway
    # (LIVENESS_PUSH_INTERVAL_S, дефолт 30 с), чтобы один пропущенный/неудачный
    # цикл не гасил живого воркера. 120 = 4 цикла.
    env(WORKER_LIVENESS_SILENCE_SECONDS): '120'

    # Доверенные прокси для getClientIp() (guest rate-limit по IP). По умолчанию —
    # приватные диапазоны (Symfony keyword `private_ranges`): доверяем nginx в
    # docker-сети. В проде можно сузить до конкретного адреса фронта.
    env(TRUSTED_PROXIES): 'private_ranges'

    # Pay-per-use стоимость конверсии сверх квоты (CNV-28), USD cents. Не секрет.
    env(PAY_PER_USE_CENTS): '5'
    env(PAY_PER_USE_AI_CENTS): '15'

    # Пакеты пополнения prepaid-баланса через Telegram Stars (CNV-28 slice 5).
    env(TOPUP_PACKS_JSON): '{"pack_100":{"usd_cents":100,"stars":100},"pack_500":{"usd_cents":500,"stars":450},"pack_2000":{"usd_cents":2000,"stars":1700}}'

    # Username Telegram-бота (без @) для deep-link `t.me/<username>` в хедере
    # (home-01-header-nav). Не секрет; используется и TelegramLoginController.
    app.telegram_bot_username: '%env(TELEGRAM_BOT_USERNAME)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # Любой адаптер OAuth-провайдера (oauth-02…04) автоматически попадает в
        # tagged-итератор реестра — новый провайдер = новый сервис с этим интерфейсом,
        # ни services.yaml реестра, ни контроллер трогать не нужно.
        App\Service\Oauth\OauthProviderInterface:
            tags: ['app.oauth_provider']

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Кастомные AbstractProvider-транспорты (Yandex/VK) — НЕ сервисы, только
            # $client-seam для тестов у YandexProvider/VkProvider (см. их конструкторы).
            # Без exclude блочный ресурс App\: регистрирует их как autowireable, и
            # Symfony инжектит СВЕЖИЙ new YandexOauth2Provider()/new VkIdOauth2Provider()
            # (БЕЗ clientId/redirectUri) в nullable $client-параметр ВМЕСТО null —
            # это молча ломало ?? new ...([...]) fallback, из-за чего client_id и
            # redirect_uri пропадали из authorize-URL целиком (инцидент 2026-07-19).
            # У Google/GitHub та же проблема невозможна — их $client типизирован
            # vendor-классом League\..., для которого сервиса вообще нет).
            - '../src/Service/Oauth/Provider/Yandex/YandexOauth2Provider.php'
            - '../src/Service/Oauth/Provider/Vk/VkIdOauth2Provider.php'

    App\Service\Auth\GuestTokenService:
        arguments:
            $secret: '%env(GUEST_COOKIE_SECRET)%'

    App\Service\Auth\GuestCookieFactory:
        arguments:
            $secure: '%env(bool:GUEST_COOKIE_SECURE)%'
            $maxAge: '%env(int:GUEST_COOKIE_TTL)%'

    App\Service\Queue\RedisConnectionFactory:
        arguments:
            $dsn: '%env(REDIS_DSN)%'

    # Separate connection on KeyDB db 1 (sessions) for refresh-token families.
    # Distinct service id → distinct instance, so no db-select bleed with db 2.
    app.redis.sessions:
        class: App\Service\Queue\RedisConnectionFactory
        arguments:
            $dsn: '%env(REDIS_SESSIONS_DSN)%'

    App\Service\Auth\RefreshTokenService:
        arguments:
            $redisFactory: '@app.redis.sessions'
            $appSecret: '%env(APP_SECRET)%'
            $ttl: '%env(int:REFRESH_TTL)%'
            $grace: '%env(int:REFRESH_GRACE)%'

    # One-time Telegram bot-login коды в KeyDB db 1 (sessions), TTL 5 мин.
    App\Service\Auth\TelegramLoginCodeStore:
        arguments:
            $redisFactory: '@app.redis.sessions'
            $ttl: 300

    # One-time коды привязки Telegram к текущему User (CNV-59), тот же Redis db.
    App\Service\Auth\TelegramLinkCodeStore:
        arguments:
            $redisFactory: '@app.redis.sessions'
            $ttl: 300

    App\Service\Auth\RefreshCookieFactory:
        arguments:
            $name: '%env(REFRESH_COOKIE_NAME)%'
            $secure: '%env(bool:REFRESH_COOKIE_SECURE)%'
            $sameSite: '%env(REFRESH_COOKIE_SAMESITE)%'
            $maxAge: '%env(int:REFRESH_TTL)%'

    # Cookie `tg_login_nonce` (pairing+poll логин). Secure — та же семантика, что и
    # refresh-cookie; TTL = TTL кода (5 мин), задаётся в фабрике по умолчанию.
    App\Service\Auth\TelegramLoginNonceCookieFactory:
        arguments:
            $secure: '%env(bool:REFRESH_COOKIE_SECURE)%'

    # Cookie `tg_link_nonce` (привязка Telegram, CNV-59). Отдельное имя от login.
    App\Service\Auth\TelegramLinkNonceCookieFactory:
        arguments:
            $secure: '%env(bool:REFRESH_COOKIE_SECURE)%'

    # OAuth CSRF-state (+ PKCE code_verifier) в KeyDB db 1 (sessions), TTL 10 мин.
    App\Service\Oauth\OauthStateStore:
        arguments:
            $redisFactory: '@app.redis.sessions'
            $ttl: 600

    # Реестр OAuth-провайдеров: tagged-итератор адаптеров (пуст в oauth-01 —
    # провайдеры приходят в oauth-02…04 через тег app.oauth_provider).
    App\Service\Oauth\OauthProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.oauth_provider

    # Google/GitHub-адаптеры (oauth-02): попадают в реестр автоматически через
    # тег app.oauth_provider (см. _instanceof выше). Пустой client_id/secret в
    # окружении (провайдер не сконфигурирован) — сервис создаётся без ошибки,
    # league-провайдер не валидирует опции при конструировании; сломается только
    # реальный запрос к провайдеру (ожидаемо для незаполненного .env.local).
    App\Service\Oauth\Provider\GoogleProvider:
        arguments:
            $clientId: '%env(GOOGLE_OAUTH_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_OAUTH_CLIENT_SECRET)%'
            $redirectBaseUrl: '%env(APP_URL)%'

    App\Service\Oauth\Provider\GithubProvider:
        arguments:
            $clientId: '%env(GITHUB_OAUTH_CLIENT_ID)%'
            $clientSecret: '%env(GITHUB_OAUTH_CLIENT_SECRET)%'
            $redirectBaseUrl: '%env(APP_URL)%'

    # Yandex-адаптер (oauth-03): кастомный AbstractProvider (нет поддерживаемого
    # league-пакета), попадает в реестр так же, как Google/GitHub — через тег
    # app.oauth_provider (см. _instanceof выше).
    App\Service\Oauth\Provider\YandexProvider:
        arguments:
            $clientId: '%env(YANDEX_OAUTH_CLIENT_ID)%'
            $clientSecret: '%env(YANDEX_OAUTH_CLIENT_SECRET)%'
            $redirectBaseUrl: '%env(APP_URL)%'

    # VK ID-адаптер (oauth-04): PKCE (S256) обязателен, client_secret у VK ID
    # НЕТ вовсе — конструктор его не принимает (см. VkProvider PHPDoc), поэтому
    # аргумент $clientSecret здесь отсутствует в отличие от остальных провайдеров.
    App\Service\Oauth\Provider\VkProvider:
        arguments:
            $clientId: '%env(VK_OAUTH_CLIENT_ID)%'
            $redirectBaseUrl: '%env(APP_URL)%'

    AsyncAws\S3\S3Client:
        arguments:
            $configuration:
                endpoint: '%env(S3_ENDPOINT)%'
                accessKeyId: '%env(S3_KEY)%'
                accessKeySecret: '%env(S3_SECRET)%'
                region: '%env(S3_REGION)%'
                pathStyleEndpoint: '%env(bool:S3_USE_PATH_STYLE)%'

    App\Service\Storage\S3Storage:
        arguments:
            $bucketPrefix: '%env(S3_BUCKET_PREFIX)%'

    # Авто-очистка устаревших файлов/строк БД по расписанию (Scheduler).
    # Пороги — пер-конверсия, ключи карт = enum->value (status/category).
    App\Service\Storage\FileCleanupService:
        arguments:
            $defaultRetentionHours: '%env(int:FILE_RETENTION_HOURS)%'
            $statusRetentionHours:
                failed: '%env(int:FILE_RETENTION_HOURS_STATUS_FAILED)%'
                expired: '%env(int:FILE_RETENTION_HOURS_STATUS_EXPIRED)%'
            $tariffRetentionHours:
                guest: '%env(int:FILE_RETENTION_HOURS_TARIFF_GUEST)%'
                free: '%env(int:FILE_RETENTION_HOURS_TARIFF_FREE)%'
                paid: '%env(int:FILE_RETENTION_HOURS_TARIFF_PAID)%'
            $categoryRetentionHours:
                video: '%env(int:FILE_RETENTION_HOURS_CATEGORY_VIDEO)%'

    App\Service\Queue\ConversionResultPersister:
        arguments:
            $resultsBucket: '%env(S3_BUCKET_PREFIX)%-results'

    # $appEnv нужен для fail-fast на «тихом даунгрейде» плана: вне prod бросаем,
    # в prod — только warning (fail-open, не ломаем платящих). Остальное — autowire.
    App\Service\Quota\QuotaService:
        arguments:
            $appEnv: '%kernel.environment%'

    # Мониторинг очередей admin-панели: URL metrics-exporter'а (остальное — autowire).
    App\Service\Admin\QueueStatsProvider:
        arguments:
            $exporterUrl: '%env(METRICS_EXPORTER_URL)%'

    # Лог конвертаций admin-панели: база-URL Graylog для линк-аута (остальное — autowire).
    App\Controller\Admin\Api\ConversionLogController:
        arguments:
            $graylogUrl: '%env(GRAYLOG_URL)%'

    # registry-04: `public: true` ТОЛЬКО для CLI-тулинга `bin/dump-matrix.php` —
    # это standalone-скрипт (не App\Command\*), который сам грузит Kernel и
    # достаёт сервисы напрямую из контейнера, а не через autowire-конструктор.
    # Application-код эти сервисы никогда так не получает — везде обычный DI.
    App\Service\Conversion\ConversionRegistry:
        public: true

    App\Repository\WorkerCapabilityRepository:
        public: true

    # Long-TTL GC worker_capabilities по расписанию (Scheduler) — registry-06.
    App\Service\Worker\WorkerCapabilityGcService:
        arguments:
            $ttlHours: '%env(int:WORKER_CAPABILITY_GC_TTL_HOURS)%'

    # Обзор воркеров admin-панели (registry-07) — TTL ТОТ ЖЕ env, что реальный
    # GC выше (WorkerCapabilityGcService), намеренно не второй литерал.
    App\Service\Admin\WorkerStatsProvider:
        arguments:
            $ttlHours: '%env(int:WORKER_CAPABILITY_GC_TTL_HOURS)%'

    # Сверка liveness по авторитетному снапшоту gateway (registry-09) —
    # ОТДЕЛЬНЫЙ env от GC-TTL: другая шкала (секунды vs дни) и другой смысл
    # (пометить offline vs удалить строку).
    App\Service\Worker\WorkerLivenessReconciler:
        arguments:
            $silenceSeconds: '%env(int:WORKER_LIVENESS_SILENCE_SECONDS)%'
