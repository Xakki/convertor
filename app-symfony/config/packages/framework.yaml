framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: true
    handle_all_throwables: true

    # i18n-фундамент (home-07): EN по умолчанию + RU, детект по Accept-Language
    # (НЕ User-Agent). framework-bundle v7.4.13 (composer.lock) — опция
    # `set_locale_from_accept_language` доступна из коробки (появилась в 7.3),
    # кастомный EventListener для самого детекта не нужен. Приоритет ВЫШЕ
    # Accept-Language (явный выбор через переключатель, cookie `locale`)
    # реализован отдельным App\EventListener\LocaleCookieListener — он
    # выставляет request-атрибут `_locale` из cookie ДО того, как встроенный
    # LocaleListener (kernel.request, приоритет 16) прочитает Accept-Language.
    default_locale: 'en'
    set_locale_from_accept_language: true
    enabled_locales: ['en', 'ru']

    # За фронтом стоит nginx (X-Forwarded-For / X-Real-IP), поэтому без доверенных
    # прокси Request::getClientIp() вернул бы IP nginx для ВСЕХ запросов — и guest
    # rate-limit «по IP» стал бы одним общим ведром на весь сайт. Доверяем прокси
    # из TRUSTED_PROXIES (по умолчанию — приватные docker-сети), заголовки X-Forwarded-*.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    php_errors:
        log: true

    # Serializer for API responses
    serializer:
        enable_attributes: true

    # Validator
    validation:
        email_validation_mode: html5

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
