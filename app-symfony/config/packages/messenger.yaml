framework:
    messenger:
        failure_transport: failed

        # One transport per routing-key → stream `conv.<key>`, group `convertor`.
        # JSON serializer (`messenger.transport.symfony_serializer`) so the Python
        # workers (the ONLY consumers) can parse the job payload.
        #
        # Custom transport (Option D — clean single-JSON wire contract). The
        # `conv+redis://` DSN scheme binds these 6 transports to
        # `App\Messenger\Transport\CleanRedisTransportFactory` instead of the stock
        # `redis-messenger` factory (which matches bare `redis://`, so `failed`
        # below still uses the stock transport). CleanRedisTransport::send() does
        # `XADD conv.<type> * message '<clean job json>'` — it writes
        # Serializer::encode()['body'] DIRECTLY into the `message` field, SKIPPING
        # the stock `{body,headers}` envelope wrap. Result: the stream carries ONE
        # clean single-JSON payload (§3) and readers decode ONCE. See
        # docs/queue-contract.md §2 and docs/superpowers/specs/…-ws-worker-transport-design.md §3/§4.
        #
        # phpredis SERIALIZER_NONE caveat is MOVED, not removed: CleanRedisTransport
        # explicitly sets `\Redis::SERIALIZER_NONE` on the connection before XADD,
        # so `message` is raw JSON, not PHP-serialize-wrapped (`s:NNN:"{json}";`).
        # The old `options.serializer: 0` is gone because we no longer build the
        # stock Connection.
        #
        # PHP MUST NOT run `messenger:consume conv_*` — the transport is produce-only
        # (get/ack/reject throw). See docs/queue-contract.md §1/§2.
        transports:
            conv_document:
                dsn: 'conv+%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conv.document
                    group: convertor

            conv_image:
                dsn: 'conv+%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conv.image
                    group: convertor

            conv_audio:
                dsn: 'conv+%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conv.audio
                    group: convertor

            conv_video:
                dsn: 'conv+%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conv.video
                    group: convertor

            conv_data:
                dsn: 'conv+%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conv.data
                    group: convertor

            conv_ai:
                dsn: 'conv+%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conv.ai
                    group: convertor

            # CNV-88: browser execution kind (screenshot/recording через
            # изолированный Chromium runtime) — отдельный стрим, независимый от
            # FileCategory (screenshot/recording хранят category image/video
            # только для quota/retention). Ни один воркер ещё не потребляет
            # conv.browser (CNV-82/90/91/113, вне этой карточки) — см. класс-
            # докблок ConversionRegistry.
            conv_browser:
                dsn: 'conv+%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conv.browser
                    group: convertor

            failed:
                dsn: '%env(REDIS_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    stream: conversions_failed

            # Generic PHP-to-PHP async transport (hardening-09/nit-2: first user is
            # TelegramAvatarRefreshMessage, moved off the webhook hot-path). Stock
            # redis-messenger factory (bare `redis://`, same as `failed` above) — a
            # DIFFERENT stream from conv.*/conversions_failed, own consumer group.
            # Default PHP serializer is fine here: only PHP (bin/console
            # messenger:consume async, supervisor `app-queue`) reads this stream,
            # unlike conv_* which Python workers decode.
            async:
                dsn: '%env(REDIS_DSN)%'
                options:
                    stream: messenger.async
                    group: async

        # ConversionManager::dispatch() targets its transport explicitly via
        # TransportNamesStamp(['conv_'.$key]) — no routing entry needed for it.
        # PHP MUST NOT run messenger:consume conv_* — gateway owns XREADGROUP/XACK.
        routing:
            App\Message\TelegramAvatarRefreshMessage: async
