framework:
    rate_limiter:
        # Лимит анонимных (guest) конвертаций по IP. Применяется в
        # ConversionController::convert только для не-ROLE_USER. Стартовое N=20/час.
        anon_convert:
            policy: 'sliding_window'
            limit: 20
            interval: '1 hour'
        # Лимит анонимных запросов GET /api/v1/quota по IP (не-ROLE_USER).
        # Ленивая guest-модель уже убрала рост `users` от флуда /quota; этот
        # лимитер — общая защита от request-флуда на дешёвом эндпоинте
        # (defense-in-depth). /quota поллит фронт, потому щедрый N=60/час.
        anon_quota:
            policy: 'sliding_window'
            limit: 60
            interval: '1 hour'

# В тестах getClientIp() всегда 127.0.0.1 → все guest-запросы делят одно ведро.
# Дефолтный storage (cache.rate_limiter→filesystem) переживает запуски phpunit и
# копит токены между прогонами. Кладём лимитер в in-memory (array) пул, чтобы
# каждый прогон стартовал с чистого ведра и тесты не флакали на 429.
when@test:
    framework:
        rate_limiter:
            anon_convert:
                cache_pool: 'cache.rate_limiter.test_array'
            anon_quota:
                cache_pool: 'cache.rate_limiter.test_array'
        cache:
            pools:
                cache.rate_limiter.test_array:
                    adapter: cache.adapter.array
