nelmio_api_doc:
    documentation:
        info:
            title: 'Convertor API'
            description: |
                Публичный REST API сервиса конвертации файлов Convertor.
                Аутентификация: JWT Bearer-токен (получить через `/api/v1/auth/telegram`).
                Версия API — `v1`, все публичные эндпоинты под префиксом `/api/v1`.
            version: '1.0.0'
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
    areas:
        # Только публичный API `/api/v1`; внутренние gateway/worker-эндпоинты
        # (`/api/v1/internal/*`, `/api/v1/worker/*`) исключены negative lookahead.
        default:
            path_patterns:
                - '^/api/v1(?!/internal|/worker)'
