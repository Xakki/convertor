nelmio_api_doc:
    documentation:
        info:
            title: 'Convertor API'
            description: |
                Публичный REST API сервиса конвертации файлов Convertor.
                Аутентификация: JWT Bearer-токен (получить через `/api/v1/auth/telegram`).
                Версия API — `v1`, все публичные эндпоинты под префиксом `/api/v1`.
            version: '1.0.0'
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                PersonalToken:
                    type: http
                    scheme: bearer
                    bearerFormat: Personal API token
                    description: Personal API token issued by POST /api/v1/auth/tokens; JWTs are not accepted by the audit-history endpoint.
                WorkerToken:
                    type: http
                    scheme: bearer
                    bearerFormat: worker token
                    description: Internal worker API token. This scheme is not a user JWT.
                GatewayToken:
                    type: http
                    scheme: bearer
                    bearerFormat: gateway token
                    description: Internal gateway token. This scheme is not a user JWT.
                TelegramWebhookSecret:
                    type: apiKey
                    in: header
                    name: X-Telegram-Bot-Api-Secret-Token
                    description: Internal Telegram webhook secret header.
        security:
            - Bearer: []
    areas:
        default:
            path_patterns:
                - '^/api/v1(?!/internal|/worker)'
        public:
            path_patterns:
                - '^/api/v1'
            with_attribute: true
        private_user:
            path_patterns:
                - '^/api/v1'
            with_attribute: true
        private_admin:
            path_patterns:
                - '^/api/v1'
            with_attribute: true
