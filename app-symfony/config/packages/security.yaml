security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: id

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        auth:
            pattern: ^/api/v1/auth
            stateless: true
            security: false

        internal_api:
            pattern: ^/api/v1/internal
            stateless: true
            custom_authenticators:
                - App\Security\GatewayInternalAuthenticator

        worker_api:
            pattern: ^/api/v1/worker
            stateless: true
            custom_authenticators:
                - App\Security\WorkerAuthenticator

        # Telegram webhook: без firewall-аутентификации — вход защищён
        # секрет-заголовком X-Telegram-Bot-Api-Secret-Token в контроллере.
        # ДОЛЖЕН стоять ДО `api`, иначе catch-all ^/api потребует ROLE_USER.
        telegram_webhook:
            pattern: ^/api/v1/telegram/webhook
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~
            # GuestAuthenticator ПОСЛЕ jwt: срабатывает только когда нет Bearer
            # (см. GuestAuthenticator::supports). JWT и guest взаимоисключающи.
            custom_authenticators:
                - App\Security\GuestAuthenticator

        main:
            lazy: true
            provider: app_user_provider

    # Залогиненный (ROLE_USER) наследует ROLE_GUEST → проходит guest-роуты.
    # Админ (ROLE_ADMIN) наследует ROLE_USER → проходит и обычные роуты.
    role_hierarchy:
        ROLE_USER: [ROLE_GUEST]
        ROLE_ADMIN: [ROLE_USER]

    access_control:
        # OAuth start/callback — публичны (нет JWT/гостя). Явная запись ДО общего
        # ^/api/v1/auth; функционально её уже покрывает префикс ^/api/v1/auth ниже
        # (и firewall `auth` тем же префиксом), но фиксируем контракт эпика явно.
        - { path: ^/api/v1/auth/oauth, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/telegram/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/formats, roles: PUBLIC_ACCESS }
        # Публичная витрина живых примеров (home-04): список + inline-отдача
        # результатов из префикса examples/ — без логина (D3 эпика home-00).
        - { path: ^/api/v1/examples, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/internal, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/v1/worker, roles: IS_AUTHENTICATED_FULLY }
        # Админка, Option B: единственная реальная граница — admin-API.
        # Правило ^/api/v1/admin ДОЛЖНО стоять ДО общего ^/api (ROLE_USER),
        # иначе админ-эндпоинты попадут под ROLE_USER-гейт. Веб-страница
        # `^/admin` НЕ гейтится (открытая оболочка, достижима навигацией;
        # секретов не содержит) — доступ режется client-guard'ом + admin-API.
        - { path: ^/api/v1/admin, roles: ROLE_ADMIN }
        # Гостю открыты: convert, status/download (/convert/{id}/...), history, quota.
        # Гейт ai/video режется в контроллере (403 auth_required), не на firewall.
        - { path: ^/api/v1/convert, roles: ROLE_GUEST }
        - { path: ^/api/v1/quota, roles: ROLE_GUEST }
        # /me доступен гостю на уровне firewall, чтобы контроллер вернул чистый 401
        # (а не firewall-403) для гостя/анонима — у них нет TG-профиля.
        - { path: ^/api/v1/me$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
