monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: debug
                channels: ["!event"]
                formatter: Xakki\LogSymfony\Formatters\CustomFormatter
                ignore_error: true
            console:
                type: stream
                path: php://stdout
                level: debug
                channels: ["!event", "!doctrine", "!console"]
                formatter: Xakki\LogSymfony\Formatters\CustomFormatter
                ignore_error: true

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: Xakki\LogSymfony\Formatters\CustomFormatter
                ignore_error: true

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: Xakki\LogSymfony\Formatters\CustomFormatter
                ignore_error: true
            console:
                type: stream
                path: php://stdout
                formatter: Xakki\LogSymfony\Formatters\CustomFormatter
                ignore_error: true
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: Xakki\LogSymfony\Formatters\CustomFormatter
                ignore_error: true
