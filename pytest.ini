[pytest]
asyncio_mode = auto
markers =
    integration: real external binaries (e.g. ffmpeg) — needs them installed/on PATH
    slow: long-running case (excluded from the fast unit run) — reserved for future use
    e2e: full runtime path through a live worker container + real S3 (see `make test-e2e`)
    drift: routing-contract drift (PHP registry vs Python workers); may fail on known gaps
