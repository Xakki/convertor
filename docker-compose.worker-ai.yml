# AI worker for the home/GPU host. Uses a locally built image (NOT pulled from Harbor);
# only the ai-base layer is published. Build the working image first, then run.
#
# ============================================================================
# ## Build (run once on the GPU host, then on code/deps changes)
# ============================================================================
# 1. Pull the published ai-base from Harbor:
#    docker login harbor.xakki.ru
#    docker pull harbor.xakki.ru/convertor/worker-ai-base:latest
#
# 2. Build the CUDA working image locally (adjust CUDA_ARCH for your card):
#    make build-ai-cuda CUDA_ARCH=86          # RTX 3080/3090 (Ampere)
#    # make build-ai-cuda CUDA_ARCH=75        # RTX 20xx / T4
#    # make build-ai-cuda CUDA_ARCH=89        # RTX 40xx (Ada Lovelace)
#    # make build-ai-cuda CUDA_ARCH=86 WITH_LLAMACPP=1   # + embedded llama.cpp GGUF
#    Find your compute capability: nvidia-smi --query-gpu=compute_cap --format=csv,noheader
#    Then strip the dot: "8.6" → CUDA_ARCH=86.
#
# ============================================================================
# ## Run — docker run (quickstart, no compose needed)
# ============================================================================
# Share already-downloaded HuggingFace weights from the host (avoids re-download):
#
#   CUDA:
#   docker run -d --name worker-ai --restart unless-stopped --gpus all \
#     -e API_BASE_URL=https://convertor.xakki.pro \
#     -e WORKER_API_TOKEN=YOUR_TOKEN \
#     -e WHISPER_DEVICE=cuda -e WHISPER_COMPUTE_TYPE=float16 \
#     -e LLM_BACKEND=ollama -e OLLAMA_URL=http://host.docker.internal:11434 \
#     -v ~/.cache/huggingface:/home/app/.cache/huggingface \
#     xakki-convertor/worker-ai:cuda
#
#   CPU:
#   docker run -d --name worker-ai --restart unless-stopped \
#     -e API_BASE_URL=https://convertor.xakki.pro \
#     -e WORKER_API_TOKEN=YOUR_TOKEN \
#     -e WHISPER_DEVICE=cpu -e WHISPER_COMPUTE_TYPE=int8 \
#     -e LLM_BACKEND=ollama -e OLLAMA_URL=http://host.docker.internal:11434 \
#     -v ~/.cache/huggingface:/home/app/.cache/huggingface \
#     xakki-convertor/worker-ai:cpu
#
# LLM text→text backend:
#   Default = embedded llama.cpp (LLM_BACKEND=llamacpp) over a HF GGUF
#   (LLM_MODEL_REPO/LLM_MODEL_FILE, default Qwen2.5-0.5B-Instruct Q4_K_M) — self-contained,
#   downloaded into the models volume on first use, no external server needed.
#   Alternative = Ollama (LLM_BACKEND=ollama):
#     a) External Ollama on host: -e OLLAMA_URL=http://host.docker.internal:11434
#     b) Share Ollama weights into container: -v ~/.ollama:/root/.ollama
#
# ============================================================================
# ## Alternative: compose
# ============================================================================
#   cp .env.worker-ai.example .env.worker-ai   # fill API_BASE_URL + WORKER_API_TOKEN
#   docker compose -f docker-compose.worker-ai.yml --env-file .env.worker-ai up -d
# GPU: uncomment the `deploy.resources.devices` block below and set WHISPER_DEVICE=cuda.

services:
    worker-ai:
        image: ${DOCKER_IMAGE_AI:-xakki-convertor/worker-ai:cuda}
        container_name: "${COMPOSE_PROJECT_NAME}-worker-ai"
        restart: unless-stopped
        stop_grace_period: 60s
        stop_signal: SIGTERM
        # ВНИМАНИЕ: 1G снят в idle-окно (QW1b). AI-инференс грузит ML-модели
        # (Whisper + embedding + llama.cpp GGUF) в RAM — при реальной нагрузке
        # поднять память, иначе OOM убьёт задачу в полёте.
        deploy:
            mode: global
            resources:
                limits:
                    cpus: "1"
                    memory: "1G"
        volumes:
            # Named volume for HuggingFace model cache (Whisper, embedding weights).
            - worker-ai-models:/home/app/.cache/huggingface
            # Dev-server settings overlay — must survive restart (NOT under WORK_DIR/tempdir).
            # Used only by `python -m workers.ai --devserver`; see ai-worker-devserver.
            - worker-ai-data:/data
            # Alternative: bind-mount already-downloaded weights from the host (no re-download):
            # - ${HF_CACHE_HOST:-~/.cache/huggingface}:/home/app/.cache/huggingface
            # Ollama sidecar weights (only needed when running an Ollama sidecar inside the
            # container — NOT for the default external-Ollama path via OLLAMA_URL).
            # Note: container runs as uid 1000 (app); /root/.ollama may not be writable.
            # - ${OLLAMA_HOME:-~/.ollama}:/root/.ollama
        environment:
            WORKER_MODULE: workers.ai.worker
            # Pull-API (required)
            API_BASE_URL: ${API_BASE_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            WORKER_TYPE: ${WORKER_TYPE:-ai}
            # STT
            WHISPER_MODEL: ${WHISPER_MODEL:-base}
            WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
            WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
            STREAM_WINDOW_SEC: ${STREAM_WINDOW_SEC:-20}
            STREAM_OVERLAP_SEC: ${STREAM_OVERLAP_SEC:-2}
            # TTS
            TTS_ENGINE: ${TTS_ENGINE:-espeak}
            # Embedding
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
            # LLM text→text — local only. Default = embedded llama.cpp over a HF GGUF
            # (self-contained, no external server). Switch LLM_BACKEND=ollama to use a
            # self-hosted Ollama server instead.
            LLM_BACKEND: ${LLM_BACKEND:-llamacpp}
            # llamacpp: pull the GGUF from a HF repo on first use (cached in the models volume).
            LLM_MODEL_REPO: ${LLM_MODEL_REPO:-Qwen/Qwen2.5-0.5B-Instruct-GGUF}
            LLM_MODEL_FILE: ${LLM_MODEL_FILE:-qwen2.5-0.5b-instruct-q4_k_m.gguf}
            OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
            # llamacpp alt: a local GGUF path instead of LLM_MODEL_REPO (takes precedence if set).
            LLM_MODEL_PATH: ${LLM_MODEL_PATH:-}
            LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
            LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
            LLM_SYSTEM_PROMPT: ${LLM_SYSTEM_PROMPT:-}
            # Dev-server (only used when overriding command to `python -m workers.ai --devserver`).
            # Persist overlay on the worker-ai-data volume. A single DEVSERVER_PORT drives both
            # the uvicorn listen port and the published port below. To reach it from the host you
            # must also set DEVSERVER_HOST=0.0.0.0 (the in-container default 127.0.0.1 is loopback-only).
            DEVSERVER_CONFIG_PATH: ${DEVSERVER_CONFIG_PATH:-/data/devserver_settings.json}
            DEVSERVER_HOST: ${DEVSERVER_HOST:-127.0.0.1}
            DEVSERVER_PORT: ${DEVSERVER_PORT:-8877}
            DEVSERVER_TOKEN: ${DEVSERVER_TOKEN:-}
            # WS Origin allowlist (anti-CSWSH). Localhost is always allowed; when reaching the
            # dev-server off-loopback or via the nginx /worker-ai/ subpath, add the public origin(s)
            # here (comma-separated, no path), else the /ws/stream handshake is rejected (1008).
            #   e.g. DEVSERVER_ALLOWED_ORIGINS=https://convertor.xakki.pro
            DEVSERVER_ALLOWED_ORIGINS: ${DEVSERVER_ALLOWED_ORIGINS:-}
        # Run the dev-server (FastAPI UI + in-process WS-client worker loop) instead of the
        # bare worker. nginx reaches it internally as worker-ai:8877, so
        # set DEVSERVER_HOST=0.0.0.0 (in .env.local) — no host ports: publish needed.
        command: ["python3", "-m", "workers.ai", "--devserver"]
        #   ports: ["${DEVSERVER_PORT:-8877}:${DEVSERVER_PORT:-8877}"]   # only for direct host curl
        # Uncomment for CUDA GPU support (nvidia-container-toolkit required on host):
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   count: 1
        #                   capabilities: [gpu]
        healthcheck:
            test: ["CMD", "python3", "-c", "import faster_whisper; print('ok')"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 60s

volumes:
    worker-ai-models:
        name: "worker-ai-models"
    worker-ai-data:
        name: "worker-ai-data"
