# AI worker for the home host (WSL + RTX GPU). Pulls a prebuilt Harbor image;
# no server-side KeyDB/S3 needed — all I/O goes through the HTTP pull-API.
# Two flavors are published: worker-ai:cpu and worker-ai:cuda (GPU).
#
# ============================================================================
# ## Запуск дома (docker run) — основной путь, без compose, без сборки
# ============================================================================
# Prereqs: `docker login harbor.xakki.ru` first; for CUDA also install
# nvidia-container-toolkit on the host. The pull-API token goes via -e (never
# committed). Whisper model downloads on first run into the named volume (~500 MB).
#
#   CPU:
#   docker run -d --name worker-ai --restart unless-stopped -e API_BASE_URL=https://convertor.xakki.pro -e WORKER_API_TOKEN=YOUR_TOKEN -e WHISPER_MODEL=base -e WHISPER_DEVICE=cpu -e WHISPER_COMPUTE_TYPE=int8 -e AI_STT_PROVIDER=local -e AI_TTS_PROVIDER=local -v worker-ai-models:/home/app/.cache/huggingface harbor.xakki.ru/convertor/worker-ai:cpu
#
#   CUDA (GPU):
#   docker run -d --name worker-ai --restart unless-stopped --gpus all -e API_BASE_URL=https://convertor.xakki.pro -e WORKER_API_TOKEN=YOUR_TOKEN -e WHISPER_MODEL=base -e WHISPER_DEVICE=cuda -e WHISPER_COMPUTE_TYPE=float16 -e AI_STT_PROVIDER=local -e AI_TTS_PROVIDER=local -v worker-ai-models:/home/app/.cache/huggingface harbor.xakki.ru/convertor/worker-ai:cuda
#
# Update: docker pull harbor.xakki.ru/convertor/worker-ai:cuda && docker rm -f worker-ai && <re-run the line above>
#
# ============================================================================
# ## Alternative: compose
# ============================================================================
#   cp .env.worker-ai.example .env.worker-ai   # fill API_BASE_URL + WORKER_API_TOKEN (+ GPU vars)
#   docker compose -f docker-compose.worker-ai.yml --env-file .env.worker-ai up -d
# GPU: uncomment the `deploy.resources.devices` block below and set WHISPER_DEVICE=cuda.

services:
    worker-ai:
        image: ${DOCKER_IMAGE_AI:-harbor.xakki.ru/convertor/worker-ai:cpu}
        container_name: "worker-ai-home"
        restart: unless-stopped
        stop_grace_period: 60s
        stop_signal: SIGTERM
        volumes:
            - worker-ai-models:/home/app/.cache/huggingface
        environment:
            WORKER_MODULE: workers.ai.worker
            API_BASE_URL: ${API_BASE_URL}
            WORKER_API_TOKEN: ${WORKER_API_TOKEN}
            WORKER_TYPE: ${WORKER_TYPE:-ai}
            WHISPER_MODEL: ${WHISPER_MODEL:-base}
            WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
            WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
            AI_STT_PROVIDER: ${AI_STT_PROVIDER:-local}
            AI_TTS_PROVIDER: ${AI_TTS_PROVIDER:-local}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
            CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
        # Uncomment for CUDA GPU support (nvidia-container-toolkit required):
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   count: 1
        #                   capabilities: [gpu]
        healthcheck:
            test: ["CMD", "python3", "-c", "import faster_whisper; print('ok')"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 60s

volumes:
    worker-ai-models:
        name: "worker-ai-models"
