version: 2
providers:
  - id: aip-g4f
    kind: g4f
    base_url: https://aip.xakki.ru
    schema: aip-g4f/v0.5
    credentials: {bearer_env: G4F_API_KEY}
    operations:
      chat:
        output_type: ai
        endpoint: /v1/chat/completions
        pairs:
          - {from: txt, to: json_ai, response: raw}
          - {from: txt, to: txt_ai, response: content}
        models:
          fast: {model: gpt-4o, label: GPT-4o, tiers: [fast, normal], fallback: [balanced]}
          balanced: {model: gpt-4.1, label: GPT-4.1, tiers: [normal, hard]}
        startup_check: {mode: chat_completion, timeout_sec: 15}
  - id: gonka
    kind: gonka
    base_url: https://gate.joingonka.ai
    schema: gonka/v1
    credentials: {bearer_env: GONKA_API_KEY}
    operations:
      chat:
        output_type: ai
        endpoint: /v1/chat/completions
        pairs:
          - {from: txt, to: json_ai, response: raw}
          - {from: txt, to: txt_ai, response: content}
        models:
          fast: {model: MiniMaxAI/MiniMax-M2.7, label: MiniMax M2.7, tiers: [fast]}
          normal: {model: deepseek-ai/DeepSeek-V4-Flash-0731, label: DeepSeek V4 Flash 0731, tiers: [normal]}
          hard: {model: moonshotai/Kimi-K2.6, label: Kimi K2.6, tiers: [hard]}
        startup_check: {mode: models, timeout_sec: 15}
routing:
  defaults: {chat: aip-g4f/fast}
